<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14b8a6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HadirKuy">
<title>HadirKuy · Absensi Digital MAN 1 BOALEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{
  --b50:#f0fdfa;--b100:#ccfbf1;--b200:#99f6e4;--b500:#14b8a6;--b600:#0d9488;--b700:#0f766e;--b900:#134e4a;
  --s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s600:#475569;--s700:#334155;--s800:#1e293b;--s900:#0f172a;
  --hijau:#86efac;--merah:#fca5a5;--oranye:#fdba74;--biru:#93c5fd;--ungu:#c4b5fd;
  --r:20px;--bayang:0 10px 40px -10px rgba(0,0,0,.06);--bayang-brand:0 20px 40px -10px rgba(20,184,166,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--s800);background:var(--s50);-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.45}
::selection{background:var(--b200)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.55;cursor:not-allowed}
a{color:var(--b600)}
i.ph,i.ph-bold,i.ph-fill{line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Tombol & form ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .12s,background .2s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
a.btn{text-decoration:none}
.btn-gelap{background:var(--s900);color:#fff}.btn-gelap:hover{background:var(--s800)}
.btn-brand{background:var(--b500);color:#fff}.btn-brand:hover{background:var(--b600)}
.btn-garis{background:#fff;border:1.5px solid var(--s200);color:var(--s700)}.btn-garis:hover{border-color:var(--s300);background:var(--s50)}
.btn-bahaya{background:#fef2f2;color:#b91c1c;border:1.5px solid #fecaca}
.btn-kecil{padding:7px 12px;border-radius:10px;font-size:13px}
.btn-penuh{width:100%}
.ikon-btn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.label{display:block;font-size:13px;font-weight:700;color:var(--s600);margin-bottom:6px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--s200);background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--b500);box-shadow:0 0 0 4px rgba(20,184,166,.15)}
.input-kecil{padding:8px 10px;border-radius:10px;font-size:14px}
.bidang{margin-bottom:14px}
.bantuan{font-size:12px;color:var(--s500);margin-top:5px}
.galat{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:14px}
.galat:empty{display:none}
.baris{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.muted{color:var(--s500)}
.kecil{font-size:12px}
.tebal{font-weight:700}
.putar{animation:putar 1s linear infinite;display:inline-block}
@keyframes putar{to{transform:rotate(360deg)}}

/* ---------- Chip status ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st-hadir{background:#dcfce7;color:#166534}
.st-terlambat{background:#ffedd5;color:#9a3412}
.st-izin{background:#dbeafe;color:#1e40af}
.st-sakit{background:#ede9fe;color:#5b21b6}
.st-alpa{background:#fee2e2;color:#991b1b}
.st-belum{background:var(--s100);color:var(--s600)}
.st-libur{background:var(--s100);color:var(--s500)}
.st-kosong{background:transparent;color:var(--s400)}

/* ---------- Mode HP (siswa & login) ---------- */
.hp{max-width:420px;margin:0 auto;background:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,.05)}
@media (min-width:421px){
  body.mode-hp{background:var(--s200);display:flex;align-items:center;justify-content:center;min-height:100vh}
  body.mode-hp .hp{height:min(850px,96vh);width:420px;border-radius:40px;border:8px solid var(--s300)}
}
.hp-head{padding:28px 22px 14px;background:#fff;flex-shrink:0}
.hp-main{flex:1;overflow-y:auto;padding:4px 22px 24px;scrollbar-width:none}
.hp-main::-webkit-scrollbar{display:none}
.hp-nav{flex-shrink:0;background:#fff;border-top:1px solid var(--s100);display:flex;justify-content:space-around;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.hp-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;width:72px;color:var(--s400);font-size:11px;font-weight:600;padding:4px 0}
.hp-nav button i{font-size:24px}
.hp-nav button.aktif{color:var(--b500);font-weight:800}
.sapa{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sapa h1{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--s900)}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--b500),var(--b600));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;box-shadow:0 0 0 3px var(--b100)}
.avatar.besar{width:76px;height:76px;font-size:28px}
.lokasi-chip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;font-weight:700;color:var(--s500);background:var(--s50);padding:7px 11px;border-radius:12px}
.lokasi-chip i{color:var(--b500);font-size:15px}
.jam-live{font-variant-numeric:tabular-nums}

.kartu-status{background:linear-gradient(135deg,var(--b500),var(--b600));border-radius:28px;padding:22px;color:#fff;box-shadow:var(--bayang-brand);position:relative;overflow:hidden;margin:8px 0 22px}
.kartu-status::before{content:"";position:absolute;top:-30px;right:-30px;width:130px;height:130px;background:#fff;opacity:.1;border-radius:50%;filter:blur(20px)}
.kartu-status::after{content:"";position:absolute;bottom:-30px;left:-30px;width:100px;height:100px;background:var(--b900);opacity:.25;border-radius:50%;filter:blur(18px)}
.kartu-status>*{position:relative;z-index:1}
.ks-atas{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.ks-atas h2{font-size:15px;font-weight:600;color:var(--b50)}
.badge{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:rgba(255,255,255,.2)}
.badge.hijau{background:#34d399;color:#064e3b}
.badge.oranye{background:#fdba74;color:#7c2d12}
.badge.abu{background:var(--s200);color:var(--s800)}
.badge.biru{background:#bfdbfe;color:#1e3a8a}
.badge.merah{background:#fecaca;color:#7f1d1d}
.ks-jam{display:flex;gap:12px}
.ks-kotak{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px}
.ks-kotak .lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85;margin-bottom:4px}
.ks-kotak .nilai{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.ks-kotak .nilai.redup{opacity:.5}
.ks-kotak .sub{font-size:11px;font-weight:700;margin-top:2px;opacity:.9}
.ks-info{margin-top:14px;font-size:12px;font-weight:600;opacity:.9;display:flex;align-items:center;gap:6px}

.btn-scan{width:100%;background:var(--s900);color:#fff;border-radius:24px;padding:18px 22px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:var(--bayang);transition:transform .12s,background .2s;margin-bottom:8px}
.btn-scan:hover{background:var(--s800)}.btn-scan:active{transform:scale(.97)}
.btn-scan .ikn{background:rgba(255,255,255,.2);padding:8px;border-radius:50%;display:flex}
.btn-scan .ikn i{font-size:24px}
.petunjuk{text-align:center;font-size:12px;color:var(--s500);font-weight:600;margin-bottom:24px}
.kartu-info{display:flex;gap:14px;align-items:flex-start;background:var(--b50);border:1px solid var(--b100);border-radius:22px;padding:18px;margin-bottom:24px}
.kartu-info>i{font-size:28px;color:var(--b600);flex-shrink:0}
.kartu-info h3{font-size:15px;font-weight:800;color:var(--s900);margin-bottom:3px}
.kartu-info p{font-size:13px;color:var(--s600)}
.kartu-info.oranye{background:#fff7ed;border-color:#fed7aa}.kartu-info.oranye>i{color:#ea580c}

.judul-seksi{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.judul-seksi h3{font-size:17px;font-weight:800;color:var(--s800)}
.tautan{font-size:12px;font-weight:700;color:var(--b600);display:inline-flex;align-items:center;gap:3px}
.statistik{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border-radius:20px;padding:15px;height:108px;display:flex;flex-direction:column;justify-content:space-between}
.stat .atas{display:flex;justify-content:space-between;align-items:flex-start}
.stat .ikn{background:rgba(255,255,255,.45);padding:8px;border-radius:12px;display:flex;font-size:18px}
.stat .angka{font-size:30px;font-weight:800;line-height:1}
.stat .nama{font-size:14px;font-weight:800}
.stat.hijau{background:var(--hijau);color:#064e3b}.stat.oranye{background:var(--oranye);color:#431407}
.stat.biru{background:var(--biru);color:#172554}.stat.merah{background:var(--merah);color:#450a0a}
.persen-hadir{margin-top:12px;font-size:12px;color:var(--s500);font-weight:600;text-align:center}

/* Riwayat */
.nav-bulan{display:flex;align-items:center;justify-content:space-between;background:var(--s50);border-radius:16px;padding:6px;margin-bottom:14px}
.nav-bulan b{font-size:15px}
.rekap-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.rekap-mini div{border-radius:14px;padding:9px 4px;text-align:center}
.rekap-mini b{display:block;font-size:19px;font-weight:800}
.rekap-mini span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.daftar-hari{display:flex;flex-direction:column;gap:8px}
.hari{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;border:1px solid var(--s100);background:#fff}
.hari.redup{background:var(--s50);opacity:.75}
.hari-tgl{font-weight:700;font-size:14px;min-width:92px}
.hari-kanan{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hari-jam{font-size:11px;color:var(--s500);font-weight:600;font-variant-numeric:tabular-nums}

/* Profil */
.profil-kepala{text-align:center;padding:10px 0 20px}
.profil-kepala h2{font-size:20px;font-weight:800;margin-top:12px}
.daftar-info{border:1px solid var(--s100);border-radius:18px;overflow:hidden;margin-bottom:16px}
.daftar-info div{display:flex;justify-content:space-between;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--s100)}
.daftar-info div:last-child{border-bottom:0}
.daftar-info span{color:var(--s500)}
.kredit{text-align:center;font-size:11px;color:var(--s400);font-weight:600;padding:18px 0 6px;letter-spacing:.02em}

/* Lapisan (scanner / hasil) */
.lapis{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;animation:muncul .25s ease}
@keyframes muncul{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.lapis.gelap{background:var(--s900);color:#fff}
.lapis.terang{background:#fff;align-items:center;justify-content:center;padding:28px;text-align:center}
.lapis-head{padding:22px;display:flex;justify-content:space-between;align-items:center}
.lapis-head h3{font-size:17px;font-weight:800}
.lapis-head .ikon-btn{background:rgba(255,255,255,.1);color:#fff}
.area-scan{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px 40px}
.area-scan>p{color:rgba(255,255,255,.7);font-size:13px;font-weight:600;text-align:center;margin-bottom:26px}
.bingkai{width:264px;height:264px;position:relative;border-radius:22px;overflow:hidden;background:#000}
.bingkai #reader{width:100%;height:100%}
.bingkai #reader video{width:100%!important;height:100%!important;object-fit:cover}
.bingkai #reader img,.bingkai #reader__dashboard{display:none!important}
.bingkai #qr-shaded-region{border-color:rgba(0,0,0,.25)!important}
.sudut{position:absolute;inset:0;pointer-events:none;z-index:3}
.sudut::before,.sudut::after,.sudut span::before,.sudut span::after{content:"";position:absolute;width:34px;height:34px;border:4px solid var(--b500)}
.sudut::before{top:0;left:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.sudut::after{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.sudut span::before{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.sudut span::after{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.garis-scan{position:absolute;left:0;right:0;height:2px;background:var(--b500);box-shadow:0 0 12px var(--b500);z-index:2;animation:pindai 2s infinite linear}
@keyframes pindai{0%,100%{top:4%}50%{top:96%}}
.bingkai.proses .garis-scan{animation-duration:.7s}
.status-scan{margin-top:24px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px;text-align:center}
.status-scan.ok{color:#5eead4}.status-scan.warn{color:#fdba74}
.hasil-ikon{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:22px;font-size:60px}
.hasil-ikon.ok{background:var(--b100);color:var(--b500);animation:lompat 1s ease 2}
.hasil-ikon.gagal{background:#ffedd5;color:#ea580c}
@keyframes lompat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.lapis.terang h2{font-size:24px;font-weight:800;color:var(--s900);margin-bottom:8px}
.lapis.terang p{color:var(--s500);font-weight:500;margin-bottom:34px;max-width:320px}
.lapis.terang .tombol{width:100%;display:flex;flex-direction:column;gap:10px}

/* Login */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;overflow-y:auto}
.logo{width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,var(--b500),var(--b600));display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;box-shadow:var(--bayang-brand);margin-bottom:20px}
.login h1{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--s900)}
.login .sub{color:var(--s500);font-weight:600;margin:4px 0 28px}
.sandi-wrap{position:relative}
.sandi-wrap .input{padding-right:48px}
.sandi-wrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--s400)}

/* ---------- Mode staf ---------- */
body.mode-staf{background:var(--s50)}
.staf{min-height:100vh;display:flex;flex-direction:column}
.staf-head{background:#fff;border-bottom:1px solid var(--s100);padding:14px clamp(14px,3vw,32px);display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.merek{display:flex;align-items:center;gap:10px}
.merek .logo{width:40px;height:40px;border-radius:12px;font-size:22px;margin:0;box-shadow:none}
.merek b{font-size:17px;font-weight:800;display:block;line-height:1.1}
.merek small{font-size:12px;color:var(--s500);font-weight:600}
.staf-user{display:flex;align-items:center;gap:12px;font-size:13px}
.staf-user .nm{text-align:right;line-height:1.2}
.staf-user .nm b{display:block}
.staf-user .nm span{color:var(--s500);font-size:12px;text-transform:capitalize}
.staf-tabs{display:flex;gap:4px;padding:10px clamp(14px,3vw,32px);overflow-x:auto;background:#fff;border-bottom:1px solid var(--s100);scrollbar-width:none;position:sticky;top:69px;z-index:19}
.staf-tabs::-webkit-scrollbar{display:none}
.staf-tabs button{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;color:var(--s500);white-space:nowrap}
.staf-tabs button i{font-size:18px}
.staf-tabs button:hover{background:var(--s50);color:var(--s800)}
.staf-tabs button.aktif{background:var(--b50);color:var(--b700)}
.staf-main{flex:1;padding:20px clamp(14px,3vw,32px) 30px;max-width:1200px;width:100%;margin:0 auto}
.panel{background:#fff;border:1px solid var(--s100);border-radius:var(--r);padding:18px;box-shadow:var(--bayang);margin-bottom:18px}
.panel h2{font-size:18px;font-weight:800;margin-bottom:4px}
.panel h3{font-size:15px;font-weight:800;margin-bottom:10px}
.panel-kepala{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.filter{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filter .bidang{margin:0;min-width:150px}
.ringkas{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.ringkas .chip{font-size:13px;padding:6px 12px}
.tabel-wrap{overflow-x:auto;border:1px solid var(--s100);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--s50);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--s500);font-weight:700;padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--s100);vertical-align:middle}
tr.klik{cursor:pointer}tr.klik:hover td{background:var(--b50)}
td.angka,th.angka{text-align:center;font-variant-numeric:tabular-nums}
.kosong{text-align:center;padding:36px 12px;color:var(--s400);font-weight:600}
.kosong i{font-size:36px;display:block;margin-bottom:8px}
.banner{padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.banner.info{background:var(--b50);color:var(--b700)}
.banner.warn{background:#fff7ed;color:#9a3412}
.perlu{color:#c2410c;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:3px}
.cek-hari{display:flex;gap:6px;flex-wrap:wrap}
.cek-hari label{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px solid var(--s200);border-radius:12px;font-weight:700;font-size:13px;cursor:pointer}
.cek-hari input{accent-color:var(--b600)}
.saklar{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.saklar input{width:20px;height:20px;accent-color:var(--b600)}
.seksi-form{border-top:1px dashed var(--s200);padding-top:16px;margin-top:6px}

/* Modal */
.modal-latar{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:muncul .2s}
@media (min-width:640px){.modal-latar{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px}
@media (min-width:640px){.modal{border-radius:24px}}
.modal.lebar{max-width:760px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h3{font-size:18px;font-weight:800}
.modal-head .ikon-btn{background:var(--s100)}
.modal-aksi{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}

/* Toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--s900);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:muncul .2s;display:flex;gap:8px;align-items:center}
.toast.gagal{background:#b91c1c}

/* Layar QR */
.layar-qr{position:fixed;inset:0;z-index:150;background:radial-gradient(circle at 20% 0%,#115e59 0,#0f172a 55%);color:#fff;display:flex;flex-direction:column;padding:clamp(16px,3vw,36px)}
.lq-atas{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.lq-madrasah{font-size:clamp(18px,2.4vw,30px);font-weight:800}
.lq-tgl{font-size:clamp(13px,1.4vw,18px);color:#99f6e4;font-weight:600}
.lq-jam{font-size:clamp(30px,5vw,64px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.lq-tengah{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0}
.lq-jenis{font-size:clamp(20px,3vw,38px);font-weight:800;letter-spacing:.08em;padding:6px 22px;border-radius:999px;background:var(--b500)}
.lq-jenis.pulang{background:#f59e0b}
.lq-qr{background:#fff;border-radius:24px;padding:14px;width:min(58vh,80vw);height:min(58vh,80vw);display:flex;align-items:center;justify-content:center;color:var(--s500);font-weight:700;text-align:center}
.lq-qr svg{width:100%;height:100%;display:block}
.lq-bar{width:min(58vh,80vw);height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.lq-bar div{height:100%;background:#5eead4;width:100%}
.lq-petunjuk{font-size:clamp(14px,1.6vw,20px);color:#ccfbf1;text-align:center}
.lq-bawah{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.lq-stat{display:flex;gap:22px;font-size:clamp(13px,1.4vw,18px);color:#ccfbf1}
.lq-stat b{font-size:clamp(20px,2.4vw,32px);color:#fff;margin-right:6px}
.lq-kontrol{display:flex;gap:8px;align-items:center;opacity:.55;transition:opacity .2s}
.lq-kontrol:hover{opacity:1}
.lq-kontrol select,.lq-kontrol button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.lq-kontrol option{color:var(--s900)}
.lq-kredit{font-size:11px;color:rgba(255,255,255,.4);text-align:center;margin-top:8px}

/* ---------- Fase 2 ---------- */
.hp-nav button{position:relative}
.titik{position:absolute;top:0;right:18px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.staf-tabs .titik{position:static;margin-left:2px}
.titik[hidden]{display:none}
.hasil-gulir{overflow-y:auto;justify-content:flex-start!important;padding-top:36px!important}
.hasil-gulir>*{flex-shrink:0}
.kartu-mood{width:100%;background:var(--s50);border:1px solid var(--s100);border-radius:20px;padding:16px;margin-bottom:14px;text-align:left}
.kartu-mood h3{font-size:15px;font-weight:800;color:var(--s900);margin-bottom:2px}
.kartu-mood .ket{font-size:11px;color:var(--s500);font-weight:600;margin-bottom:12px;display:flex;gap:5px;align-items:center}
.emoji-baris{display:flex;justify-content:space-between;gap:6px}
.emoji-baris button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:14px;border:2px solid transparent;font-size:11px;font-weight:700;color:var(--s500);transition:transform .12s,border .15s,background .15s}
.emoji-baris button span{font-size:28px;line-height:1}
.emoji-baris button:hover{background:#fff}
.emoji-baris button.pilih{border-color:var(--b500);background:#fff;color:var(--b700);transform:translateY(-2px)}
.mood-balas{font-size:13px;color:var(--s600);margin-top:10px;font-weight:600}
.mood-balas:empty{display:none}
.cek-cerita{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px;font-weight:600;color:var(--s700);cursor:pointer}
.cek-cerita input{width:18px;height:18px;margin-top:1px;accent-color:var(--b600);flex-shrink:0}
.kartu-doa{width:100%;background:linear-gradient(135deg,#f0fdfa,#ecfeff);border:1px solid var(--b100);border-radius:20px;padding:16px;text-align:center;margin-bottom:18px}
.kartu-doa .jdl{font-size:12px;font-weight:800;color:var(--b700);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kartu-doa .arab{font-family:"Amiri","Traditional Arabic","Scheherazade New",serif;font-size:22px;line-height:2;color:var(--s900);direction:rtl;margin-bottom:8px}
.kartu-doa .latin{font-size:13px;font-style:italic;color:var(--s700);margin-bottom:6px}
.kartu-doa .arti{font-size:12px;color:var(--s500)}
.lapis.terang .kartu-doa p,.lapis.terang .kartu-mood p{margin:0;max-width:none}
.pengajuan{border:1px solid var(--s100);border-radius:18px;padding:14px;margin-bottom:10px;background:#fff}
.pengajuan .atas{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.pengajuan .tgl{font-weight:800;font-size:14px}
.pengajuan .sub{font-size:12px;color:var(--s500);font-weight:600}
.pengajuan .alasan{font-size:13px;color:var(--s700);background:var(--s50);border-radius:12px;padding:9px 11px;margin:8px 0}
.pengajuan .catatan{font-size:12px;color:var(--s600);border-left:3px solid var(--b200);padding-left:9px;margin:8px 0}
.pengajuan .aksi{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.st-menunggu{background:#fef9c3;color:#854d0e}
.st-disetujui{background:#dcfce7;color:#166534}
.st-ditolak{background:#fee2e2;color:#991b1b}
.st-dibatalkan{background:var(--s100);color:var(--s500)}
.st-terkirim{background:#dcfce7;color:#166534}
.st-antri{background:#fef9c3;color:#854d0e}
.st-diproses{background:#dbeafe;color:#1e40af}
.st-gagal{background:#fee2e2;color:#991b1b}
.segmen{display:flex;background:var(--s100);border-radius:14px;padding:4px;gap:4px}
.segmen label{flex:1;text-align:center;padding:10px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;color:var(--s500)}
.segmen input{display:none}
.segmen label:has(input:checked){background:#fff;color:var(--s900);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pratinjau-foto{margin-top:10px;max-height:180px;border-radius:12px;display:block;max-width:100%}
.foto-bukti{width:100%;border-radius:14px;display:block}
.kartu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sapa-kartu{border:1px solid var(--s100);border-radius:18px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.sapa-kartu .nm{font-weight:800}
.alasan-chip{display:flex;gap:6px;flex-wrap:wrap}
.tl-terakhir{font-size:12px;color:var(--s600);background:var(--b50);border-radius:12px;padding:8px 10px}
.mood-ikon{font-size:18px}
.pesan-wa{font-size:12px;color:var(--s600);max-width:420px;white-space:pre-wrap}
.status-ext{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}


/* ---------- Fase 3 ---------- */
.bar-offline{position:fixed;top:0;left:0;right:0;z-index:300;background:#f59e0b;color:#1c1917;font-size:12px;font-weight:800;text-align:center;padding:4px 8px}
body:has(#bar-offline){padding-top:24px}
body:has(#bar-offline) .staf-head{top:24px}
body:has(#bar-offline) .staf-tabs{top:93px}
@media (max-width:420px){body:has(#bar-offline) .hp{height:calc(100dvh - 24px)}}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--s100);border-radius:18px;padding:14px 16px;box-shadow:var(--bayang)}
.kpi .lbl{font-size:12px;font-weight:700;color:var(--s500);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:800;color:var(--s900);font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.kpi .val small{font-size:14px;color:var(--s500);font-weight:700}
.kpi .sub{font-size:12px;color:var(--s500);font-weight:600;margin-top:2px}
.kpi .tanda{width:10px;height:10px;border-radius:3px;display:inline-block}
.dua-kolom{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media (max-width:960px){.dua-kolom{grid-template-columns:1fr}}
.grafik{position:relative;width:100%}
.grafik svg{width:100%;height:auto;display:block;overflow:visible;font-family:inherit}
.grafik .tip{position:absolute;pointer-events:none;background:var(--s900);color:#fff;font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .1s;z-index:5;line-height:1.4}
.grafik .tip b{font-weight:800}
.grafik [data-tip]{cursor:pointer}
.grafik .titik-aktif{r:6}
.pilihan-periode{display:flex;gap:6px;flex-wrap:wrap}
.pilihan-periode button{border:1.5px solid var(--s200);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;color:var(--s600);background:#fff}
.pilihan-periode button.aktif{border-color:var(--b500);background:var(--b50);color:var(--b700)}
.ket-kecil{font-size:12px;color:var(--s500);margin-top:8px}
.kembali{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--b700);margin-bottom:12px}
.pos-wrap{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:18px;align-items:start}
@media (max-width:860px){.pos-wrap{grid-template-columns:1fr}}
.pos-kamera{background:#0f172a;border-radius:20px;overflow:hidden;aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-weight:700;text-align:center;padding:0}
.pos-kamera #pos-reader{position:absolute;inset:0}
.pos-kamera #pos-reader video{width:100%!important;height:100%!important;object-fit:cover}
.pos-kamera #pos-reader img,.pos-kamera #pos-reader__dashboard{display:none!important}
.pos-hasil{border-radius:22px;padding:22px;text-align:center;border:2px solid var(--s100);background:var(--s50);min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .2s,border .2s}
.pos-hasil .nm{font-size:24px;font-weight:800;color:var(--s900)}
.pos-hasil .st{font-size:15px;font-weight:700}
.pos-hasil.ok{background:#f0fdf4;border-color:#86efac}.pos-hasil.ok .st{color:#166534}
.pos-hasil.telat{background:#fff7ed;border-color:#fdba74}.pos-hasil.telat .st{color:#9a3412}
.pos-hasil.gagal{background:#fef2f2;border-color:#fca5a5}.pos-hasil.gagal .st{color:#991b1b}
.pos-hasil.antre{background:#fefce8;border-color:#fde047}.pos-hasil.antre .st{color:#854d0e}
.pos-riwayat{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.pos-riwayat div{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--s50)}
.cari-hasil{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cari-hasil .baris-siswa{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--s100);border-radius:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.staf-user .nm{display:none}.staf-tabs{top:69px}.kartu-grid{grid-template-columns:1fr}}

/* =====================================================================
   TEMA: Mint Aqua 3D — Premium Soft UI
   Lapisan ini menimpa gaya dasar: latar pastel, kartu putih timbul,
   sudut membulat besar, bayangan lembut berwarna mint, tombol 3D.
   ===================================================================== */
:root{
  --b50:#effefb;--b100:#d5fbf2;--b200:#a7f3e4;--b500:#14b8a6;--b600:#0ea5a0;--b700:#0f766e;--b900:#134e4a;
  --aqua:#22d3ee;--aqua-muda:#cffafe;
  --latar:radial-gradient(1100px 620px at -5% -10%,#d4fbf1 0%,rgba(212,251,241,0) 60%),
          radial-gradient(900px 600px at 105% 0%,#d9f4ff 0%,rgba(217,244,255,0) 58%),
          radial-gradient(900px 700px at 50% 110%,#ede9ff 0%,rgba(237,233,255,0) 60%),#f3fbfa;
  --r:26px;
  --bayang:0 18px 40px -20px rgba(13,148,136,.38),0 4px 14px -8px rgba(15,23,42,.10);
  --bayang-brand:0 22px 44px -16px rgba(14,165,160,.55),0 6px 14px -6px rgba(14,165,160,.35);
  --bayang-tekan:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 0 rgba(13,148,136,.06);
  --tepi:1px solid rgba(255,255,255,.85);
}
body,body.mode-staf{background:var(--latar);background-attachment:fixed}
@media (min-width:421px){body.mode-hp{background:var(--latar);background-attachment:fixed}
  body.mode-hp .hp{border:10px solid rgba(255,255,255,.75);box-shadow:0 40px 80px -30px rgba(13,148,136,.45),0 0 0 1px rgba(13,148,136,.08)}}
.hp{background:linear-gradient(180deg,#f2fffc 0%,#f4fbff 55%,#f7f5ff 100%)}
.hp-head{background:transparent}

/* Kartu & panel: putih timbul */
.panel,.kpi,.pengajuan,.sapa-kartu,.daftar-info,.hari,.kartu-mood,.kartu-doa,.modal,.cari-hasil .baris-siswa{
  border:var(--tepi);border-radius:var(--r);background:rgba(255,255,255,.92);box-shadow:var(--bayang),var(--bayang-tekan)}
.hari{border-radius:20px}
.hari.redup{background:rgba(255,255,255,.55);box-shadow:none}
.kpi{border-radius:22px}
.tabel-wrap{border:var(--tepi);border-radius:20px;background:#fff;box-shadow:var(--bayang-tekan)}
th{background:linear-gradient(180deg,#f2fffc,#e9fbf7);color:#0f766e}
td{border-top-color:#eef7f5}
tr.klik:hover td{background:#effefb}

/* Tombol 3D */
.btn{border-radius:16px}
.btn-gelap,.btn-brand,.btn-scan{background:linear-gradient(180deg,#3fe0c8 0%,#14b8a6 55%,#0ea5a0 100%);color:#fff;
  box-shadow:0 12px 22px -12px rgba(14,165,160,.9),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(15,118,110,.35);text-shadow:0 1px 1px rgba(15,118,110,.35)}
.btn-gelap:hover,.btn-brand:hover,.btn-scan:hover{background:linear-gradient(180deg,#4ae6cf 0%,#17c2b0 55%,#0ea5a0 100%);filter:saturate(1.05)}
.btn-gelap:active:not(:disabled),.btn-brand:active:not(:disabled),.btn-scan:active{transform:translateY(1px) scale(.98);box-shadow:0 6px 12px -8px rgba(14,165,160,.9),inset 0 2px 4px rgba(15,118,110,.35)}
.btn-garis{background:linear-gradient(180deg,#fff,#f4fffc);border:1px solid #d5f5ee;color:#0f766e;box-shadow:0 8px 16px -12px rgba(13,148,136,.45),inset 0 1px 0 #fff}
.btn-garis:hover{background:#fff;border-color:#a7f3e4}
.btn-bahaya{background:linear-gradient(180deg,#fff5f6,#ffe4e8);border:1px solid #fecdd3;color:#be123c;box-shadow:0 8px 16px -12px rgba(225,29,72,.4),inset 0 1px 0 #fff}
.btn-scan{border-radius:26px;padding:19px 22px}
.btn-scan .ikn{background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.ikon-btn{border-radius:14px}

/* Form */
.input{border:1.5px solid #d5f5ee;background:linear-gradient(180deg,#fbfffe,#f3fdfa);border-radius:16px;box-shadow:inset 0 2px 4px rgba(13,148,136,.05)}
.input:focus{border-color:#2dd4bf;box-shadow:0 0 0 4px rgba(45,212,191,.18),inset 0 2px 4px rgba(13,148,136,.05);background:#fff}
.segmen{background:#e6faf5;border-radius:18px}
.segmen label:has(input:checked){box-shadow:0 6px 14px -8px rgba(13,148,136,.5);color:#0f766e}

/* Avatar */
.avatar{background:linear-gradient(145deg,#5eead4,#14b8a6 60%,#0e9e98);box-shadow:0 10px 20px -10px rgba(14,165,160,.8),0 0 0 3px #fff,0 0 0 5px #ccfbf1;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.lokasi-chip{background:rgba(255,255,255,.85);box-shadow:var(--bayang);border:var(--tepi);border-radius:14px}

/* Kartu status siswa: kaca mint 3D */
.kartu-status{background:linear-gradient(140deg,#5ff0da 0%,#22c9b6 42%,#0ea5a0 100%);border-radius:30px;
  box-shadow:0 26px 48px -22px rgba(14,165,160,.75),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 14px rgba(15,118,110,.25)}
.kartu-status::before{background:#fff;opacity:.22;filter:blur(24px)}
.kartu-status::after{background:#22d3ee;opacity:.35}
.ks-atas{align-items:flex-start;margin-bottom:12px}
.ks-atas .ks-judul{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ks-ilus{margin:-12px -10px -18px 0;filter:drop-shadow(0 10px 12px rgba(15,118,110,.35))}
.ks-kotak{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.badge{background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* Statistik pastel 3D */
.stat{border-radius:24px;box-shadow:0 16px 28px -18px rgba(15,23,42,.35),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -4px 10px rgba(0,0,0,.05);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-18px;bottom:-18px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.35)}
.stat.hijau{background:linear-gradient(145deg,#bbf7d0,#86efac)}.stat.oranye{background:linear-gradient(145deg,#fed7aa,#fdba74)}
.stat.biru{background:linear-gradient(145deg,#bfdbfe,#93c5fd)}.stat.merah{background:linear-gradient(145deg,#fecdd3,#fca5a5)}
.stat .ikn{background:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 #fff,0 4px 8px -4px rgba(0,0,0,.15);border-radius:14px}

/* Kartu info, banner, chip */
.kartu-info{background:linear-gradient(145deg,#ffffff,#effefb);border:var(--tepi);border-radius:24px;box-shadow:var(--bayang)}
.kartu-info>i{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px!important;color:#fff!important;
  background:linear-gradient(145deg,#5eead4,#14b8a6);box-shadow:0 10px 18px -10px rgba(14,165,160,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.kartu-info.oranye{background:linear-gradient(145deg,#fff,#fff7ed)}
.kartu-info.oranye>i{background:linear-gradient(145deg,#fdba74,#f97316);box-shadow:0 10px 18px -10px rgba(249,115,22,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.banner{border-radius:18px;box-shadow:var(--bayang-tekan)}
.banner.info{background:linear-gradient(145deg,#effefb,#e0fbf6)}
.chip{box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}

/* Navigasi bawah mengambang (kaca) */
.hp-nav{margin:0 12px calc(12px + env(safe-area-inset-bottom));padding:8px 8px;border-radius:26px;background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:var(--tepi);box-shadow:0 18px 36px -18px rgba(13,148,136,.55)}
.hp-nav button{border-radius:18px;padding:7px 0}
.hp-nav button.aktif{background:linear-gradient(180deg,#e3fbf6,#cdf7ef);color:#0f766e;box-shadow:inset 0 1px 0 #fff}

/* Staf: kepala & tab kaca */
.staf-head,.staf-tabs{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(13,148,136,.08)}
.merek .logo{background:linear-gradient(145deg,#5eead4,#0ea5a0);box-shadow:0 10px 18px -10px rgba(14,165,160,.9),inset 0 1px 0 rgba(255,255,255,.5);border-radius:14px}
.staf-tabs button{border-radius:16px}
.staf-tabs button.aktif{background:linear-gradient(180deg,#3fe0c8,#14b8a6);color:#fff;box-shadow:0 10px 18px -12px rgba(14,165,160,.95),inset 0 1px 0 rgba(255,255,255,.45)}
.pilihan-periode button,.dp-pil button{border-radius:14px;background:#fff;border-color:#d5f5ee;box-shadow:0 6px 12px -10px rgba(13,148,136,.5)}
.pilihan-periode button.aktif{background:linear-gradient(180deg,#e3fbf6,#cdf7ef);border-color:#5eead4}
.panel-kepala .ilus-panel{margin:-14px -6px -18px 0;flex-shrink:0;filter:drop-shadow(0 10px 10px rgba(15,118,110,.18))}
@media (max-width:700px){.panel-kepala .ilus-panel{display:none}}

/* Login */
.login{align-items:stretch}
.ilus-login{display:flex;justify-content:center;margin:-10px 0 8px;filter:drop-shadow(0 14px 16px rgba(15,118,110,.22))}
.login h1{text-align:center}.login .sub{text-align:center}
.login form,.login .bidang{position:relative}

/* Hasil absen & kosong */
.hasil-ilus{margin-bottom:12px;filter:drop-shadow(0 16px 18px rgba(15,118,110,.25));animation:ambang 2.6s ease-in-out infinite}
@keyframes ambang{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.lapis.terang{background:linear-gradient(180deg,#f2fffc,#f4fbff 60%,#f7f5ff)}
.kosong .ilus{display:block;margin:0 auto 8px;opacity:.95}
.ilus-sambut{display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,#fff,#effefb);border:var(--tepi);border-radius:26px;padding:12px 16px;box-shadow:var(--bayang);margin-bottom:16px}
.ilus-sambut .ilus,.panel-kepala .ilus,.pos-hasil .ilus,.ks-ilus .ilus{flex-shrink:0}
.ilus-sambut h3{font-size:16px;font-weight:800;color:#0f172a;margin-bottom:2px}.ilus-sambut p{font-size:12.5px;color:var(--s500)}

/* Modal & toast */
.modal-latar{background:rgba(15,118,110,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{border-radius:30px 30px 0 0}
@media (min-width:640px){.modal{border-radius:30px}}
.toast{background:linear-gradient(180deg,#134e4a,#0f3d3a);border-radius:18px}

/* Layar QR: mint gelap bercahaya */
.layar-qr{background:radial-gradient(900px 500px at 15% -10%,#2dd4bf 0%,rgba(45,212,191,0) 55%),radial-gradient(800px 500px at 110% 110%,#22d3ee 0%,rgba(34,211,238,0) 50%),linear-gradient(160deg,#0f766e,#134e4a 60%,#0b3b38)}
.lq-qr{border-radius:32px;box-shadow:0 40px 70px -30px rgba(0,0,0,.55),inset 0 -6px 0 rgba(13,148,136,.15)}
.lq-jenis{background:linear-gradient(180deg,#5eead4,#14b8a6);box-shadow:0 14px 26px -14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.lq-jenis.pulang{background:linear-gradient(180deg,#fcd34d,#f59e0b)}

/* Diagnosa koneksi */
.diag{margin-top:12px;background:rgba(255,255,255,.92);border:var(--tepi);border-radius:20px;padding:12px 14px;box-shadow:var(--bayang);display:flex;flex-direction:column;gap:10px;text-align:left}
.diag-baris{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.diag-baris>span{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:12px}
.diag-baris.ok>span{background:#dcfce7;color:#166534}.diag-baris.gagal>span{background:#fee2e2;color:#991b1b}.diag-baris.tunggu>span{background:#f1f5f9;color:#64748b}
.diag-baris p{font-size:12px;color:var(--s600);margin-top:2px;line-height:1.5}
.diag-baris code{font-size:11px;background:#f1f5f9;padding:1px 5px;border-radius:6px;word-break:break-all}

/* Foto profil */
.foto-besar{width:112px;height:112px;margin:0 auto;font-size:40px}
.foto-aksi{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.foto-pratinjau{width:220px;height:220px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;box-shadow:0 0 0 4px #fff,0 0 0 7px #ccfbf1,var(--bayang)}
.foto-mini{width:34px;height:34px;border-radius:12px;object-fit:cover;display:inline-block;vertical-align:middle;background:#e6faf5;box-shadow:inset 0 0 0 1px #d5f5ee}
.lencana-verif{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#0f766e;background:#d5fbf2;border-radius:99px;padding:3px 9px}
.pos-foto{width:132px;height:132px;border-radius:28px;object-fit:cover;box-shadow:0 0 0 4px #fff,0 16px 30px -14px rgba(15,23,42,.45);margin-bottom:6px}
.pos-hasil{border-radius:28px;box-shadow:var(--bayang)}
.pos-kamera{border-radius:28px;box-shadow:var(--bayang)}
button.avatar{cursor:pointer;border:0;padding:0}

function toast(pesan, gagal = false) {

  t.className = 'toast' + (gagal ? ' gagal' : '');

  $('#toast').appendChild(t);

function galatJaringan(teknis = '') {
  const offline = navigator.onLine === false;
  const e = new Error(offline
    ? 'Tidak ada koneksi internet. Periksa sinyal lalu coba lagi.'
    : 'Server tidak dapat dihubungi. Internet Anda tersambung, tetapi server HadirKuy tidak merespons. Tekan "Cek koneksi server" untuk melihat penyebabnya.');
  e.jaringan = true; e.teknis = teknis; return e;
}
async function rpc(fn, args = {}, pakaiToken = true) {
  let hasil;
  try { hasil = await sb.rpc(fn, pakaiToken ? { p_token: S.token, ...args } : args); }
  catch (e) { throw galatJaringan(e && e.message); }
  const { data, error } = hasil;
  if (error) {
    const msg = error.message || 'Terjadi kesalahan. Coba lagi.';
    if (error.code === 'PGRST202' || /Could not find the function/i.test(msg))
      throw new Error('Database belum disiapkan atau belum versi terbaru. Jalankan file hadirkuy_supabase.sql di Supabase > SQL Editor.');
    if (/Invalid API key|No API key|apikey|JWS|JWT/i.test(msg) && !/SESI/.test(msg))
      throw new Error('Kunci server salah. Periksa SUPABASE_ANON_KEY di index.html (Supabase > Project Settings > API > anon public).');
    if (msg.startsWith('SESI_BERAKHIR')) {
      keluarLokal();
      renderLogin('Sesi berakhir, silakan masuk kembali.');
      throw new Error('SESI');
    }
    if (/Failed to fetch|NetworkError|network|Load failed|fetch failed|TypeError/i.test(msg) || (!error.code && navigator.onLine === false)) throw galatJaringan(msg);
    throw new Error(msg);
  }
  return data;
}

async function muatFoto(ids, paksa = false) {
  const perlu = [...new Set(ids.map(Number))].filter(i => i && (paksa || !FOTO.has(i)));
  for (let i = 0; i < perlu.length; i += 60) {
    const potong = perlu.slice(i, i + 60);
    try {
      const d = await rpc('hk_foto_ambil', { p_ids: potong });
      potong.forEach(id => FOTO.set(id, d[id] ? `data:${d[id].mime};base64,${d[id].data}` : null));
    } catch (e) { if (e.message === 'SESI') return; }
  }
  segarAvatar();
}
async function siapkanFotoSaya() {
  const p = S.profil; if (!p) return;
  if (!p.foto_versi) { FOTO.set(p.id, null); segarAvatar(); return; }
  try {
    const c = JSON.parse(simpan.get('hk_foto_saya') || 'null');
    if (c && c.id === p.id && c.versi === p.foto_versi) { FOTO.set(p.id, c.src); segarAvatar(); return; }
  } catch (e) {}
  await muatFoto([p.id], true);
  if (fotoSrc(p.id)) simpan.set('hk_foto_saya', JSON.stringify({ id: p.id, versi: p.foto_versi, src: fotoSrc(p.id) }));
}
// Potong tengah menjadi persegi, perkecil ke 480 px, simpan JPEG (±40–80 KB)
function kompresFotoProfil(file) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('Pilih file foto (JPG/PNG).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sisi = Math.min(img.width, img.height), sx = (img.width - sisi) / 2, sy = (img.height - sisi) * 0.35;
      const cv = document.createElement('canvas'); cv.width = cv.height = 480;
      const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high';
      g.drawImage(img, sx, Math.max(0, sy), sisi, sisi, 0, 0, 480, 480);
      URL.revokeObjectURL(url);
      let q = 0.82, data = cv.toDataURL('image/jpeg', q);
      while (data.length > 290000 && q > 0.4) { q -= 0.1; data = cv.toDataURL('image/jpeg', q); }
      res(data);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Foto tidak dapat dibaca.')); };
    img.src = url;
  });
}
function modalFoto(target, { selesai } = {}) {

        ${ada ? '<button class="btn btn-bahaya" id="mf-hapus"><i class="ph-bold ph-trash"></i>Hapus</button>' : ''}
      </div>`}`);
  if (terkunci) return;
  let data = null;

  $('#mf-pilih', m).onclick = () => file.click();

    catch (e) { galat.textContent = e.message; }

  };
  $('#mf-simpan', m).onclick = async () => {
    const b = $('#mf-simpan', m); b.disabled = true;
    try {

      FOTO.set(target.id, data);
      if (diriSendiri) { S.profil.foto_versi = r.versi; S.profil.foto_terverifikasi = r.terverifikasi; simpan.set('hk_foto_saya', JSON.stringify({ id: target.id, versi: r.versi, src: data })); }
      segarAvatar(); m.remove(); toast('Foto tersimpan.'); selesai && selesai();
    } catch (e) { if (e.message !== 'SESI') galat.textContent = e.message; b.disabled = false; }
  };
  const h = $('#mf-hapus', m);
  if (h) h.onclick = async () => {

}

/* ---------- Diagnosa koneksi: menunjukkan penyebab pasti gagal terhubung ---------- */
async function diagnosaKoneksi(wadah) {
  const baris = [];
  const tulis = () => { wadah.innerHTML = `<div class="diag">${baris.map(([ok, judul, ket]) =>
    `<div class="diag-baris ${ok === null ? 'tunggu' : ok ? 'ok' : 'gagal'}"><span>${ok === null ? '…' : ok ? '✓' : '✗'}</span><div><b>${esc(judul)}</b>${ket ? `<p>${ket}</p>` : ''}</div></div>`).join('')}</div>`; };
  const langkah = judul => { baris.push([null, judul, '']); tulis(); return (ok, ket = '') => { baris[baris.length - 1] = [ok, judul, ket]; tulis(); return ok; }; };

  let s = langkah('Internet perangkat');
  if (!s(navigator.onLine !== false, navigator.onLine === false ? 'Perangkat tidak tersambung ke internet. Nyalakan data seluler atau Wi-Fi.' : '')) return;

  s = langkah('Alamat server di index.html');
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(SB_URL)) {
    if (!s(/^https?:\/\/.+/i.test(SB_URL), `Alamat terbaca: <code>${esc(SB_URL || '(kosong)')}</code>. Seharusnya berbentuk <code>https://kodeproyek.supabase.co</code> (salin dari Supabase &gt; Project Settings &gt; API &gt; Project URL).`)) return;
  } else s(true, `<code>${esc(SB_URL)}</code>`);

  s = langkah('Server Supabase merespons');
  let res;
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 12000);
    res = await fetch(SB_URL + '/rest/v1/', { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }, signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(t);
  } catch (e) {
    s(false, `Server tidak terjangkau${e.name === 'AbortError' ? ' (tidak menjawab dalam 12 detik)' : ''}. Kemungkinan penyebab:
      <br>1) <b>Proyek Supabase sedang dijeda (paused)</b> karena beberapa hari tidak dipakai. Buka dashboard Supabase, pilih proyek, tekan <b>Restore project</b>, tunggu ±2 menit.
      <br>2) Alamat proyek salah ketik.
      <br>3) Jaringan sekolah/operator memblokir <code>supabase.co</code>. Coba dengan data seluler.`);
    return;
  }
  if (res.status === 401 || res.status === 403) { s(false, 'Server menolak kunci akses. <b>SUPABASE_ANON_KEY</b> salah atau bukan milik proyek ini. Salin ulang kunci <b>anon public</b> dari Supabase &gt; Project Settings &gt; API.'); return; }
  if (res.status >= 500) { s(false, `Server sedang bermasalah (HTTP ${res.status}). Biasanya karena proyek baru saja dipulihkan. Tunggu beberapa menit lalu coba lagi.`); return; }
  s(true, `HTTP ${res.status}`);

  s = langkah('Database HadirKuy terpasang');
  try {
    const { error } = await sb.rpc('hk_masuk', { p_username: '__cek__', p_password: '__cek__' });
    if (error && (error.code === 'PGRST202' || /Could not find the function/i.test(error.message))) {
      s(false, 'Fungsi database belum ada. Jalankan file <b>hadirkuy_supabase.sql</b> di Supabase &gt; SQL Editor, lalu coba lagi.');
      return;
    }
    if (error) { s(false, esc(error.message)); return; }
    s(true, 'Semua baik. Silakan masuk.');
  } catch (e) { s(false, 'Gagal memanggil database: ' + esc(e.message)); }
}

      <input class="input" id="l-user" name="username" autocomplete="username" inputmode="text" required placeholder="Contoh: 0012345678"></div>
    <div class="bidang"><label class="label" for="l-sandi">Kata Sandi</label>
      <div class="sandi-wrap"><input class="input" id="l-sandi" type="password" name="password" autocomplete="current-password" required>
      <button type="button" class="ikon-btn" id="l-lihat" aria-label="Tampilkan kata sandi"><i class="ph ph-eye"></i></button></div>
      <p class="bantuan">Pertama kali masuk? Kata sandi awal sama dengan NISN. Kamu akan diminta menggantinya.</p></div>
    <button class="btn btn-gelap btn-penuh" id="l-tombol" style="padding:15px;margin-top:6px">Masuk <i class="ph-bold ph-arrow-right"></i></button>
    <button type="button" class="tautan" id="l-diag" style="margin:16px auto 0;display:flex"><i class="ph-bold ph-stethoscope"></i>Cek koneksi server</button>
    <div id="l-diag-hasil"></div>
    <div class="kredit" style="margin-top:20px">${esc(KONFIG.KREDIT)}</div>
  </form></div>`;
  $('#l-lihat').onclick = () => { const i = $('#l-sandi'); i.type = i.type === 'password' ? 'text' : 'password'; };
  $('#l-diag').onclick = () => diagnosaKoneksi($('#l-diag-hasil'));
  $('#f-login').onsubmit = async e => {
    e.preventDefault();
    const tombol = $('#l-tombol'), galat = $('#login-galat');
    tombol.disabled = true; tombol.innerHTML = '<i class="ph-bold ph-spinner putar"></i> Memeriksa…'; galat.textContent = '';
    try {
      const r = await rpc('hk_masuk', { p_username: $('#l-user').value, p_password: $('#l-sandi').value }, false);
      if (!r.ok) throw new Error(r.pesan);
      S.token = r.token; simpan.set('hk_token', r.token);
      await muatBeranda(); S.tab = 'beranda'; masukAplikasi();
    } catch (err) {
      if (err.message === 'SESI') return;
      galat.textContent = err.message;
      tombol.disabled = false; tombol.innerHTML = 'Masuk <i class="ph-bold ph-arrow-right"></i>';
    }
  };
}

function htmlFormSandi(id) {
  return `<form id="${id}">
    <div class="galat" id="${id}-galat"></div>
    <div class="bidang"><label class="label">Kata sandi lama</label><input class="input" type="password" name="lama" autocomplete="current-password" required></div>
    <div class="bidang"><label class="label">Kata sandi baru</label><input class="input" type="password" name="baru" autocomplete="new-password" minlength="6" required>
      <p class="bantuan">Minimal 6 karakter dan tidak sama dengan NISN/username.</p></div>
    <div class="bidang"><label class="label">Ulangi kata sandi baru</label><input class="input" type="password" name="ulang" autocomplete="new-password" required></div>
    <button class="btn btn-gelap btn-penuh">Simpan Kata Sandi</button></form>`;
}
function pasangFormSandi(id, selesai) {
  const f = $('#' + id);
  f.onsubmit = async e => {
    e.preventDefault();
    const g = $('#' + id + '-galat'), btn = f.querySelector('button');
    g.textContent = '';
    if (f.baru.value !== f.ulang.value) { g.textContent = 'Kata sandi baru dan ulangannya tidak sama.'; return; }
    btn.disabled = true;
    try { const p = await rpc('hk_ganti_password', { p_lama: f.lama.value, p_baru: f.baru.value }); S.profil = p; if (S.b) S.b.profil = p; selesai(); }
    catch (err) { if (err.message !== 'SESI') g.textContent = err.message; btn.disabled = false; }
  };
}

function renderGantiWajib() {

/* =====================================================================
   APLIKASI SISWA
   ===================================================================== */
function renderSiswa() {
  document.body.className = 'mode-hp';
  const nav = [['beranda', 'ph-house', 'Beranda'], ['izin', 'ph-envelope-simple', 'Izin'], ['riwayat', 'ph-calendar-check', 'Riwayat'], ['profil', 'ph-user', 'Profil']];
  app.innerHTML = `<div class="hp" id="hp">
    <header class="hp-head" id="hp-head"></header>
    <main class="hp-main" id="hp-main"></main>
    <nav class="hp-nav">${nav.map(([id, ik, lb]) => `<button data-tab="${id}"><i class="ph ${ik}"></i>${lb}${id === 'izin' ? '<span class="titik" id="titik-izin" hidden></span>' : ''}</button>`).join('')}</nav>
    <div id="lapisan"></div></div>`;
  $$('.hp-nav button').forEach(b => b.onclick = () => gantiTabSiswa(b.dataset.tab));
  gantiTabSiswa(S.tab || 'beranda', true);
}

async function gantiTabSiswa(tab, tanpaMuat = false) {
  S.tab = tab;
  $$('.hp-nav button').forEach(b => {
    const aktif = b.dataset.tab === tab;
    b.classList.toggle('aktif', aktif);
    const i = b.querySelector('i'); i.className = i.className.replace(/\bph(-fill)?\b(?= )/, aktif ? 'ph-fill' : 'ph');
  });
  $('#hp-main').scrollTop = 0;
  segarTitikIzin();
  if (tab === 'beranda') {
    tampilBeranda();
    if (!tanpaMuat) { try { await muatBeranda(); if (S.tab === 'beranda') tampilBeranda(); } catch (e) {} }
  } else if (tab === 'riwayat') {
    S.bulan = S.bulan || bulanIni();
    tampilRiwayatSiswa();
  } else if (tab === 'izin') tampilIzinSiswa();
  else tampilProfilSiswa();
}
function segarTitikIzin() {
  const t = $('#titik-izin'); if (!t || !S.b) return;
  const n = S.b.pengajuan_menunggu || 0;
  t.hidden = !n; t.textContent = n;
}

function htmlKepalaSiswa(judul) {
  const p = S.profil;
  if (judul) return `<div class="sapa"><h1>${esc(judul)}</h1></div>`;
  return `<div class="sapa"><div><h1>Halo, ${esc(namaDepan(p.nama))}! 👋</h1>
      <p class="muted tebal kecil" style="margin-top:3px" data-tgl></p></div>
      ${htmlAvatar(p.id, p.nama, '', 'role="button" tabindex="0" data-ke-profil aria-label="Buka profil"')}</div>
    <div class="lokasi-chip"><i class="ph-fill ph-map-pin"></i>${esc(S.b.madrasah)}${p.kelas ? ' · ' + esc(p.kelas) : ''}</div>`;
}

function tampilBeranda() {
  const b = S.b, a = b.absen, h = b.hari_ini, r = b.rekap_bulan || { hadir: 0, terlambat: 0, izin: 0, sakit: 0, alpa: 0, hari_efektif: 0 };
  const jamKini = fmtJam(sekarang());
  let badge = ['Belum Absen', ''], aksi = '';
  const info = (ikon, judul, teks, warna = '') => `<div class="kartu-info ${warna}"><i class="ph-duotone ${ikon}"></i><div><h3>${esc(judul)}</h3><p>${esc(teks)}</p></div></div>`;
  const tombol = jenis => `<button class="btn-scan" data-scan="${jenis}"><span class="ikn"><i class="ph-bold ph-qr-code"></i></span>Scan QR ${jenis === 'masuk' ? 'Masuk' : 'Pulang'}</button>`;

  if (!h.hari_sekolah) {
    badge = ['Libur', 'abu'];
    aksi = info('ph-sun', h.libur ? `Hari ini libur: ${h.libur}` : 'Hari ini bukan hari sekolah', 'Selamat beristirahat dan habiskan waktu bersama keluarga.');
  } else if (a && (a.status === 'izin' || a.status === 'sakit')) {
    badge = [a.status === 'sakit' ? 'Sakit' : 'Izin', 'biru'];
    aksi = info(a.status === 'sakit' ? 'ph-first-aid' : 'ph-envelope-simple',
      a.status === 'sakit' ? 'Semoga lekas sembuh' : 'Izinmu sudah tercatat',
      a.status === 'sakit' ? 'Istirahat yang cukup, ya. Teman-teman menunggumu kembali.' : 'Semoga urusanmu dimudahkan. Sampai jumpa di madrasah.')
      + (jamKini >= h.jam_buka_masuk && jamKini <= h.jam_tutup_masuk
          ? `<p class="petunjuk" style="margin-top:-12px">Ternyata bisa hadir? <button class="tautan" data-scan="masuk">Scan QR Masuk</button></p>` : '');
  } else if (a && a.jam_pulang) {
    badge = ['Sudah Pulang', 'abu'];
    aksi = info('ph-hand-waving', 'Terima kasih sudah hadir hari ini', 'Sampai jumpa besok. Hati-hati di jalan!');
  } else if (a && a.jam_masuk) {
    badge = ['Di Madrasah', 'hijau'];
    aksi = jamKini < h.jam_pulang
      ? tombol('pulang') + `<p class="petunjuk">Absen pulang dibuka pukul ${esc(h.jam_pulang)} ${esc(S.label)}</p>`
      : (jamKini > h.jam_tutup_pulang
          ? info('ph-clock-countdown', 'Absen pulang sudah ditutup', `Ditutup pukul ${h.jam_tutup_pulang} ${S.label}.`, 'oranye')
          : tombol('pulang') + `<p class="petunjuk">Pindai QR Pulang di layar madrasah sebelum meninggalkan madrasah</p>`);
  } else if (a && (a.status === 'hadir' || a.status === 'terlambat')) {
    badge = ['Hadir', 'hijau'];
    aksi = info('ph-check-circle', 'Kehadiranmu sudah dicatat wali kelas', a.keterangan || 'Selamat belajar!');
  } else if (a && a.status === 'alpa') {
    badge = ['Tidak Hadir', 'merah'];
    aksi = info('ph-info', 'Tercatat tidak hadir hari ini', 'Jika ini keliru, sampaikan kepada wali kelasmu.', 'oranye');
  } else if (jamKini > h.jam_tutup_masuk) {
    badge = ['Belum Absen', 'merah'];
    aksi = info('ph-clock-countdown', 'Absen masuk sudah ditutup', `Ditutup pukul ${h.jam_tutup_masuk} ${S.label}. Jika kamu hadir, temui wali kelas. Jika berhalangan, ajukan izin/sakit.`, 'oranye')
      + `<button class="btn btn-garis btn-penuh" data-ke="izin" style="margin:-10px 0 24px"><i class="ph-bold ph-envelope-simple"></i>Ajukan Izin / Sakit</button>`;
  } else if (jamKini < h.jam_buka_masuk) {
    aksi = info('ph-moon-stars', 'Absen masuk belum dibuka', `Dibuka pukul ${h.jam_buka_masuk} ${S.label}. Jangan lupa sarapan dan berdoa sebelum berangkat.`);
  } else {
    aksi = tombol('masuk') + `<p class="petunjuk">Tepat waktu sampai pukul ${esc(h.jam_masuk)} ${esc(S.label)}${h.toleransi_menit ? ` (toleransi ${h.toleransi_menit} menit)` : ''}</p>`;
  }

  // Fase 2: cek perasaan (bila belum diisi) & pengajuan yang sedang ditinjau
  if (a && a.jam_masuk && !a.perasaan && !a.jam_pulang) aksi += htmlKartuMood(null, a.ingin_cerita);
  const nAntre = antreSiswa.jumlah();
  if (nAntre) aksi = `<div class="banner warn"><i class="ph-bold ph-cloud-arrow-up"></i><span>${nAntre} absen tersimpan offline dan akan dikirim otomatis saat ada internet.</span></div>` + aksi;
  if (S.offline) aksi = `<div class="banner warn"><i class="ph-bold ph-wifi-slash"></i><span>Offline: data di bawah adalah data terakhir. Scan tetap bisa, absen akan dikirim saat online.</span></div>` + aksi;
  if (b.pengajuan_menunggu) aksi += `<div class="banner info" style="margin-top:-8px;margin-bottom:22px"><i class="ph-bold ph-hourglass"></i><span>${b.pengajuan_menunggu} pengajuan izin/sakit sedang ditinjau wali kelas. <button class="tautan" data-ke="izin">Lihat</button></span></div>`;

  const pct = persenHadir(r);
  $('#hp-head').innerHTML = htmlKepalaSiswa();
  $('#hp-main').innerHTML = `
    <section class="kartu-status">
      <div class="ks-atas"><div class="ks-judul"><h2>Status Kehadiran</h2><span class="badge ${badge[1]}">${esc(badge[0])}</span></div><div class="ks-ilus">${ilus('sekolah', 104)}</div></div>
      <div class="ks-jam">
        <div class="ks-kotak"><div class="lbl"><i class="ph-bold ph-sign-in"></i>Masuk</div>
          <div class="nilai ${a && a.jam_masuk ? '' : 'redup'}">${esc(a && a.jam_masuk || '--:--')}</div>
          ${a && a.status === 'terlambat' && a.menit_terlambat ? `<div class="sub">terlambat ${a.menit_terlambat} mnt</div>` : ''}</div>
        <div class="ks-kotak"><div class="lbl"><i class="ph-bold ph-sign-out"></i>Pulang</div>
          <div class="nilai ${a && a.jam_pulang ? '' : 'redup'}">${esc(a && a.jam_pulang || '--:--')}</div></div>
      </div>
      <div class="ks-info"><i class="ph-bold ph-clock"></i>Jam madrasah&nbsp;<span class="jam-live" data-jam></span></div>
    </section>
    ${aksi}
    <section>
      <div class="judul-seksi"><h3>Bulan Ini</h3><button class="tautan" data-ke="riwayat">Detail <i class="ph-bold ph-caret-right"></i></button></div>
      <div class="statistik">
        <div class="stat hijau"><div class="atas"><span class="ikn"><i class="ph-bold ph-check-circle"></i></span><span class="angka">${r.hadir}</span></div><span class="nama">Hadir</span></div>
        <div class="stat oranye"><div class="atas"><span class="ikn"><i class="ph-bold ph-clock"></i></span><span class="angka">${r.terlambat}</span></div><span class="nama">Terlambat</span></div>
        <div class="stat biru"><div class="atas"><span class="ikn"><i class="ph-bold ph-file-text"></i></span><span class="angka">${r.izin + r.sakit}</span></div><span class="nama">Izin/Sakit</span></div>
        <div class="stat merah"><div class="atas"><span class="ikn"><i class="ph-bold ph-x-circle"></i></span><span class="angka">${r.alpa}</span></div><span class="nama">Alpa</span></div>
      </div>
      ${pct !== null ? `<p class="persen-hadir">Kehadiran ${pct}% dari ${r.hari_efektif} hari efektif</p>` : ''}
    </section>`;
  detak();
  $$('[data-scan]').forEach(x => x.onclick = () => bukaScanner(x.dataset.scan));
  $$('[data-ke]').forEach(x => x.onclick = () => gantiTabSiswa(x.dataset.ke));
  $$('[data-ke-profil]').forEach(x => x.onclick = () => gantiTabSiswa('profil'));
  pasangKartuMood($('#hp-main'));
  segarTitikIzin();
}

/* ---------- Fase 2: cek perasaan & doa ---------- */
function htmlKartuMood(nilai, cerita) {
  return `<div class="kartu-mood" data-mood-kartu>
    <h3>Bagaimana perasaanmu hari ini?</h3>
    <div class="ket"><i class="ph-bold ph-lock-key"></i>Hanya wali kelas & guru BK yang dapat melihat.</div>
    <div class="emoji-baris">${MOOD.map(m => `<button type="button" data-mood="${m.n}" class="${nilai === m.n ? 'pilih' : ''}" aria-label="${m.l}"><span>${m.e}</span>${m.l}</button>`).join('')}</div>
    <label class="cek-cerita"><input type="checkbox" data-cerita ${cerita ? 'checked' : ''}>Aku ingin bercerita dengan guru BK</label>
    <p class="mood-balas" data-mood-balas></p></div>`;
}
function pasangKartuMood(akar) {
  const k = akar && akar.querySelector('[data-mood-kartu]'); if (!k) return;
  let nilai = null;
  const kirim = async () => {
    const cerita = k.querySelector('[data-cerita]').checked, balas = k.querySelector('[data-mood-balas]');
    if (!nilai && !cerita) return;
    try {
      await rpc('hk_perasaan', { p_nilai: nilai, p_cerita: cerita });
      if (S.b && S.b.absen) { S.b.absen.perasaan = nilai; S.b.absen.ingin_cerita = cerita; }
      balas.textContent = cerita
        ? 'Terima kasih sudah mau bercerita. Guru BK akan menyapamu, ya.'
        : nilai <= 2 ? 'Terima kasih sudah jujur. Kamu tidak sendiri; wali kelas dan guru BK siap mendengarkan.'
        : nilai === 3 ? 'Terima kasih. Semoga harimu makin baik dan ilmunya berkah.'
        : 'Alhamdulillah! Semoga semangatmu menular ke teman-teman.';
    } catch (e) { if (e.message !== 'SESI') balas.textContent = e.message; }
  };
  k.querySelectorAll('[data-mood]').forEach(b => b.onclick = () => {
    nilai = Number(b.dataset.mood);
    k.querySelectorAll('[data-mood]').forEach(x => x.classList.toggle('pilih', x === b));
    kirim();
  });
  k.querySelector('[data-cerita]').onchange = kirim;
}
const htmlDoa = jenis => { const d = DOA[jenis]; return `<div class="kartu-doa"><div class="jdl">${esc(d.judul)}</div>
  <div class="arab" lang="ar">${d.arab}</div><p class="latin">${esc(d.latin)}</p><p class="arti">“${esc(d.arti)}”</p></div>`; };

/* ---------- Riwayat (dipakai siswa & staf) ---------- */
function htmlNavBulan(bulan) {
  const kini = bulanIni();
  const bisaMaju = bulan.y < kini.y || (bulan.y === kini.y && bulan.m < kini.m);
  return `<div class="nav-bulan">
    <button class="ikon-btn" data-geser="-1" aria-label="Bulan sebelumnya"><i class="ph-bold ph-caret-left"></i></button>
    <b>${BULAN[bulan.m - 1]} ${bulan.y}</b>
    <button class="ikon-btn" data-geser="1" aria-label="Bulan berikutnya" ${bisaMaju ? '' : 'disabled'}><i class="ph-bold ph-caret-right"></i></button></div>`;
}
function geserBulan(bulan, n) {
  let m = bulan.m + n, y = bulan.y;
  if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
  return { y, m };
}
function htmlRiwayat(d) {
  const r = d.rekap, pct = persenHadir(r);
  const sel = (n, lb, cls) => `<div class="${cls}"><b>${n}</b><span>${lb}</span></div>`;
  const hari = d.hari.map(h => {
    let kiri;
    if (h.status) kiri = chip(h.status);
    else if (h.libur) kiri = `<span class="chip st-libur">${esc(h.libur)}</span>`;
    else if (!h.hari_sekolah) kiri = '<span class="chip st-libur">Libur</span>';
    else kiri = chip(null);
    const jam = (h.jam_masuk || h.jam_pulang)
      ? `<span class="hari-jam">${esc(h.jam_masuk || '--:--')} – ${esc(h.jam_pulang || '--:--')}${h.menit_terlambat ? ` · ${h.menit_terlambat} mnt` : ''}</span>` : '';
    const ket = h.keterangan ? `<span class="hari-jam">${esc(h.keterangan)}</span>` : '';
    return `<div class="hari ${(!h.hari_sekolah || h.libur) && !h.status ? 'redup' : ''}"><div class="hari-tgl">${fmtTglPendek(h.tanggal)}</div><div class="hari-kanan">${kiri}${jam}${ket}</div></div>`;
  }).join('');
  return `<div class="rekap-mini">
      ${sel(r.hadir, 'Hadir', 'st-hadir')}${sel(r.terlambat, 'Telat', 'st-terlambat')}${sel(r.izin, 'Izin', 'st-izin')}${sel(r.sakit, 'Sakit', 'st-sakit')}${sel(r.alpa, 'Alpa', 'st-alpa')}
    </div>
    ${pct !== null ? `<p class="persen-hadir" style="margin:-6px 0 14px">Kehadiran ${pct}% dari ${r.hari_efektif} hari efektif</p>` : ''}
    <div class="daftar-hari">${hari || '<div class="kosong"><i class="ph ph-calendar-blank"></i>Belum ada data bulan ini</div>'}</div>`;
}

async function tampilRiwayatSiswa() {
  $('#hp-head').innerHTML = htmlKepalaSiswa('Riwayat Kehadiran');
  const main = $('#hp-main');
  main.innerHTML = `<div class="ilus-sambut">${ilus('kalender', 80)}<div><h3>Jejak istiqamahmu</h3><p>Lihat kehadiranmu setiap hari. Sedikit demi sedikit, lama-lama menjadi bukit.</p></div></div>` + htmlNavBulan(S.bulan) + '<div id="riw-isi"><div class="kosong"><i class="ph-bold ph-spinner putar"></i>Memuat…</div></div>';
  $$('[data-geser]', main).forEach(x => x.onclick = () => { S.bulan = geserBulan(S.bulan, +x.dataset.geser); tampilRiwayatSiswa(); });
  try {
    const d = await rpc('hk_riwayat_saya', { p_tahun: S.bulan.y, p_bulan: S.bulan.m });
    if (S.tab === 'riwayat') $('#riw-isi').innerHTML = htmlRiwayat(d);
  } catch (e) { if (e.message !== 'SESI') $('#riw-isi').innerHTML = `<div class="galat">${esc(e.message)}</div>`; }
}

  $('#hp-main').innerHTML = `
    <div class="profil-kepala">${htmlAvatar(p.id, p.nama, 'foto-besar')}<h2>${esc(p.nama)}</h2><p class="muted tebal kecil">${esc(S.b.madrasah)}</p>
      ${p.foto_terverifikasi ? '<span class="lencana-verif" style="margin-top:6px"><i class="ph-bold ph-seal-check"></i>Foto terverifikasi</span>' : ''}

    <div class="daftar-info">
      <div><span>NISN</span><b>${esc(p.username)}</b></div>
      <div><span>Kelas</span><b>${esc(p.kelas || '—')}</b></div>
      <div><span>Zona waktu</span><b>${esc(S.label)}</b></div>
    </div>

// Kompres foto di HP agar ringan (maks. sisi 1280 px, JPEG)
function kompresFoto(file) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('Pilih file foto (JPG/PNG).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const skala = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * skala); cv.height = Math.round(img.height * skala);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      let q = 0.75, data = cv.toDataURL('image/jpeg', q);
      while (data.length > 1300000 && q > 0.35) { q -= 0.1; data = cv.toDataURL('image/jpeg', q); }
      if (data.length > 1300000) return rej(new Error('Foto terlalu besar. Coba foto ulang dengan resolusi lebih kecil.'));
      res(data);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Foto tidak dapat dibaca.')); };
    img.src = url;
  });
}

/* ---------- Pemindai QR + lokasi ---------- */
let pemindai = null, sedangProses = false, janjiLokasi = null;

function ambilLokasi() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ ok: false, alasan: 'perangkat tidak mendukung GPS' });
    navigator.geolocation.getCurrentPosition(
      p => res({ ok: true, lat: p.coords.latitude, lng: p.coords.longitude, akurasi: Math.round(p.coords.accuracy) }),
      e => res({ ok: false, alasan: e.code === 1 ? 'izin lokasi ditolak' : e.code === 3 ? 'waktu habis' : 'sinyal GPS lemah' }),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 20000 });
  });
}

async function hentikanPemindai() {
  const p = pemindai; pemindai = null;
  if (!p) return;
  try { if (p.isScanning) await p.stop(); } catch (e) {}
  try { p.clear(); } catch (e) {}
}

async function bukaScanner(jenis) {
  S.jenisScan = jenis; sedangProses = false;
  const lap = $('#lapisan');
  lap.innerHTML = `<div class="lapis gelap" id="ov-scan">
    <div class="lapis-head"><button class="ikon-btn" id="sc-tutup" aria-label="Tutup"><i class="ph-bold ph-x"></i></button>
      <h3>Scan QR ${jenis === 'masuk' ? 'Masuk' : 'Pulang'}</h3><span style="width:38px"></span></div>
    <div class="area-scan">
      <p>Arahkan kamera ke QR Code yang tampil di layar madrasah.</p>
      <div class="bingkai" id="bingkai"><div id="reader"></div><div class="garis-scan"></div><div class="sudut"><span></span></div></div>
      <div class="status-scan" id="sc-status"><i class="ph-bold ph-spinner putar"></i>Membaca lokasi…</div>
    </div></div>`;
  $('#sc-tutup').onclick = tutupLapisan;

  janjiLokasi = ambilLokasi();
  janjiLokasi.then(l => {
    const st = $('#sc-status'); if (!st || sedangProses) return;
    if (l.ok) { st.className = 'status-scan ok'; st.innerHTML = `<i class="ph-fill ph-map-pin"></i>Lokasi terbaca (akurasi ±${l.akurasi} m)`; }
    else { st.className = 'status-scan warn'; st.innerHTML = `<i class="ph-bold ph-warning"></i>Lokasi belum terbaca: ${esc(l.alasan)}`; }
  });

  if (!window.Html5Qrcode) return tampilHasil(false, 'Komponen pemindai gagal dimuat. Periksa koneksi internet lalu muat ulang aplikasi.');
  try {
    pemindai = new Html5Qrcode('reader');
    await pemindai.start({ facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; } },
      teks => prosesQR(teks), () => {});
  } catch (e) {
    await hentikanPemindai();
    tampilHasil(false, location.protocol !== 'https:' && location.hostname !== 'localhost'
      ? 'Kamera hanya bisa dipakai bila aplikasi dibuka lewat alamat https://.'
      : 'Kamera tidak dapat dibuka. Izinkan akses kamera untuk situs ini di pengaturan browser, lalu coba lagi.');
  }
}

async function prosesQR(teks) {
  if (sedangProses) return;
  sedangProses = true;
  if (navigator.vibrate) navigator.vibrate(60);
  const bk = $('#bingkai'); if (bk) bk.classList.add('proses');
  const st = $('#sc-status'); if (st) { st.className = 'status-scan'; st.innerHTML = '<i class="ph-bold ph-spinner putar"></i>Memproses…'; }
  await hentikanPemindai();

  let lok = await janjiLokasi;
  if (!lok.ok && S.b.wajib_lokasi) lok = await ambilLokasi();
  if (!lok.ok && S.b.wajib_lokasi) {
    return tampilHasil(false, `Lokasi tidak terbaca (${lok.alasan}). Aktifkan GPS dan izinkan akses lokasi untuk browser ini, lalu coba lagi.`);
  }
  try {
    const r = await rpc('hk_absen', { p_qr: teks, p_lat: lok.ok ? lok.lat : null, p_lng: lok.ok ? lok.lng : null, p_perangkat: PERANGKAT });
    try { await muatBeranda(); } catch (e) {}
    tampilHasil(true, pesanSukses(r), r);
  } catch (e) {
    if (e.message === 'SESI') return;
    // Fase 3: tanpa sinyal → simpan di HP, kirim otomatis saat online
    if (e.jaringan && /^HADIRKUY\|(masuk|pulang)\|\d{1,12}\|[0-9a-f]+$/.test(teks)) {
      antreSiswa.tambah({ qr: teks, lat: lok.ok ? lok.lat : null, lng: lok.ok ? lok.lng : null, jenis: teks.split('|')[1], jam: fmtJam(sekarang()) });
      tampilHasil('antre', 'Tidak ada sinyal. Absenmu sudah disimpan di HP ini dan akan dikirim otomatis begitu ada internet. Waktu absen mengikuti QR yang kamu pindai, jadi tidak dianggap terlambat karena sinyal.');
    } else tampilHasil(false, e.message);
  }
}

/* ---------- Fase 3: antrean offline (siswa & pos petugas) ---------- */
function buatAntrean(kunci) {
  return {
    ambil() { try { return JSON.parse(simpan.get(kunci) || '[]'); } catch (e) { return []; } },
    simpan(a) { simpan.set(kunci, JSON.stringify(a)); },
    tambah(x) { const a = this.ambil(); a.push({ ...x, id: Date.now() + Math.random() }); this.simpan(a); segarBarOffline(); },
    hapus(id) { this.simpan(this.ambil().filter(x => x.id !== id)); segarBarOffline(); },
    jumlah() { return this.ambil().length; },
  };
}
const antreSiswa = buatAntrean('hk_antre_siswa'), antrePos = buatAntrean('hk_antre_pos');
let sedangKirimAntre = false;
async function kirimAntrean() {
  if (sedangKirimAntre || !S.token || navigator.onLine === false) return;
  if (!antreSiswa.jumlah() && !antrePos.jumlah()) return;
  sedangKirimAntre = true;
  let ok = 0;
  try {
    for (const x of antreSiswa.ambil()) {
      try { await rpc('hk_absen', { p_qr: x.qr, p_lat: x.lat, p_lng: x.lng, p_perangkat: PERANGKAT, p_tertunda: true }); antreSiswa.hapus(x.id); ok++; }
      catch (e) { if (e.jaringan || e.message === 'SESI') throw e; antreSiswa.hapus(x.id); toast(`Absen ${x.jenis} offline (${x.jam}) ditolak: ${e.message}`, true); }
    }
    for (const x of antrePos.ambil()) {
      try { await rpc('hk_pos_absen', { p_kode: x.kode || null, p_siswa: x.siswa || null, p_jenis: x.jenis, p_waktu: x.waktu }); antrePos.hapus(x.id); ok++; }
      catch (e) { if (e.jaringan || e.message === 'SESI') throw e; antrePos.hapus(x.id); toast(`Scan offline ${x.label || ''} ditolak: ${e.message}`, true); }
    }
  } catch (e) { /* masih offline: coba lagi nanti */ }
  sedangKirimAntre = false;
  if (ok) {
    toast(`${ok} absen offline berhasil dikirim.`);
    try { await muatBeranda(); } catch (e) {}
    if (S.profil && S.profil.peran === 'siswa' && S.tab === 'beranda' && !$('#lapisan')?.innerHTML) tampilBeranda();
  }
}
function segarBarOffline() {
  let bar = $('#bar-offline');
  const n = antreSiswa.jumlah() + antrePos.jumlah(), off = navigator.onLine === false;
  if (!off && !n) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.id = 'bar-offline'; bar.className = 'bar-offline'; document.body.appendChild(bar); }
  bar.textContent = (off ? 'Offline' : 'Online') + (n ? ` · ${n} absen menunggu dikirim` : ' · data mungkin belum terbaru');
}
window.addEventListener('online', () => { segarBarOffline(); kirimAntrean(); });
window.addEventListener('offline', segarBarOffline);
setInterval(kirimAntrean, 60000);

function pesanSukses(r) {
  if (r.jenis === 'masuk') {
    return r.status === 'terlambat'
      ? `Alhamdulillah, kamu sudah sampai. Absen masuk tercatat pukul ${r.jam} ${r.label_zona} (terlambat ${r.menit_terlambat} menit). Besok berangkat sedikit lebih awal, ya!`
      : `Absen masuk tercatat pukul ${r.jam} ${r.label_zona}. Selamat belajar, semoga ilmunya berkah!`;
  }
  return `Absen pulang tercatat pukul ${r.jam} ${r.label_zona}. Terima kasih sudah belajar hari ini. Hati-hati di jalan!`;
}

function tampilHasil(ok, pesan, r = null) {
  const lap = $('#lapisan'); if (!lap) return;
  const antre = ok === 'antre'; if (antre) ok = true;
  const tambahan = ok && r ? (r.jenis === 'masuk' ? htmlKartuMood(null, false) + htmlDoa('masuk') : htmlDoa('pulang')) : '';
  lap.innerHTML = `<div class="lapis terang ${tambahan ? 'hasil-gulir' : ''}">
    <div class="hasil-ilus">${ilus(antre ? 'awan' : ok ? 'centang' : 'peringatan', 150)}</div>
    <h2>${antre ? 'Tersimpan Offline' : ok ? 'Berhasil!' : 'Belum Berhasil'}</h2>
    <p>${esc(pesan)}</p>
    ${tambahan}
    <div class="tombol">
      ${ok ? '' : '<button class="btn btn-brand btn-penuh" id="h-ulang" style="padding:15px"><i class="ph-bold ph-arrow-clockwise"></i>Coba Lagi</button>'}
      <button class="btn btn-gelap btn-penuh" id="h-kembali" style="padding:15px">Kembali ke Beranda</button>
    </div></div>`;
  $('#h-kembali').onclick = tutupLapisan;
  if (!ok) $('#h-ulang').onclick = () => bukaScanner(S.jenisScan);
  pasangKartuMood(lap);
}
