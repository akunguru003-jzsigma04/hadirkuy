const XLSX_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
const HARI_PENDEK = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
const pct = (a, b) => b ? Math.round((a / b) * 1000) / 10 : null;
const fmtPct = v => v === null || v === undefined ? '—' : `${String(v).replace('.', ',')}%`;
function muatSkrip(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some(x => x.src === src && x.dataset.siap)) return res();
    const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => { sc.dataset.siap = '1'; res(); };
    sc.onerror = () => rej(new Error('Komponen unduhan gagal dimuat. Periksa koneksi internet.'));
    document.head.appendChild(sc);
  });
}
function namaFile(teks) { return String(teks).replace(/[^\w.-]+/g, '_'); }

/* ---------- Grafik SVG (satu warna, tooltip saat disentuh/diarahkan) ---------- */
const WARNA_SERI = '#0d9488', WARNA_GRID = '#e2e8f0', WARNA_TEKS = '#64748b';
function svgGaris(titik, { tinggi = 220, min = null, max = 100, aria = 'Grafik', satuan = '%', lebar: W = 640 } = {}) {
  const H = tinggi, pl = 40, pr = 14, pt = 14, pb = 30;
  const ys = titik.map(t => t.y).filter(v => v !== null && v !== undefined);
  if (!ys.length) return '<div class="kosong"><i class="ph ph-chart-line"></i>Belum ada data pada periode ini.</div>';
  const lo = min ?? Math.max(0, Math.floor((Math.min(...ys) - 5) / 10) * 10), hi = max;
  const n = titik.length, lebar = W - pl - pr;
  const x = i => pl + (n <= 1 ? lebar / 2 : (i * lebar) / (n - 1));
  const y = v => pt + (1 - (v - lo) / ((hi - lo) || 1)) * (H - pt - pb);
  const langkah = (hi - lo) > 40 ? 20 : 10;
  let grid = '';
  for (let v = lo; v <= hi + 0.001; v += langkah) grid += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${WARNA_GRID}" stroke-width="1"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${WARNA_TEKS}">${v}${satuan}</text>`;
  const k = Math.max(1, Math.ceil(n / 8));
  const labelX = titik.map((t, i) => (i % k === 0 || i === n - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${WARNA_TEKS}">${esc(t.x)}</text>` : '').join('');
  let d = '', mulai = true;
  titik.forEach((t, i) => { if (t.y === null || t.y === undefined) { mulai = true; return; } d += `${mulai ? 'M' : 'L'}${x(i).toFixed(1)} ${y(t.y).toFixed(1)}`; mulai = false; });
  const lebarHit = n <= 1 ? lebar : lebar / (n - 1);
  const titikSvg = titik.map((t, i) => t.y === null || t.y === undefined ? '' :
    `<circle data-i="${i}" cx="${x(i)}" cy="${y(t.y)}" r="4" fill="${WARNA_SERI}" stroke="#fff" stroke-width="2"/>`).join('');
  const hit = titik.map((t, i) => t.y === null || t.y === undefined ? '' :
    `<rect data-tip="${esc(t.tip)}" data-i="${i}" data-x="${x(i)}" data-y="${y(t.y)}" x="${x(i) - lebarHit / 2}" y="${pt}" width="${lebarHit}" height="${H - pt - pb}" fill="transparent"/>`).join('');
  return `<div class="grafik"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${grid}${labelX}
    <path d="${d}" fill="none" stroke="${WARNA_SERI}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${titikSvg}${hit}</svg><div class="tip"></div></div>`;
}
function svgBatangH(baris, { aria = 'Grafik batang', maks = 100, satuan = '%', lebar: W = 640 } = {}) {
  if (!baris.length) return '<div class="kosong"><i class="ph ph-chart-bar-horizontal"></i>Belum ada data.</div>';
  const tinggiBaris = 30, pl = 110, pr = 56, H = baris.length * tinggiBaris + 6;
  const lebar = W - pl - pr, sx = v => (Math.max(0, v) / (maks || 1)) * lebar;
  return `<div class="grafik"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${baris.map((b, i) => {
    const yy = i * tinggiBaris + 6, w = b.nilai === null ? 0 : Math.max(sx(b.nilai), 2);
    return `<text x="${pl - 10}" y="${yy + 16}" text-anchor="end" font-size="12" font-weight="600" fill="#334155">${esc(b.label)}</text>
      <rect x="${pl}" y="${yy + 4}" width="${lebar}" height="16" rx="4" fill="#f1f5f9"/>
      ${b.nilai === null ? '' : `<rect x="${pl}" y="${yy + 4}" width="${w}" height="16" rx="4" fill="${WARNA_SERI}"/>`}
      <text x="${pl + lebar + 8}" y="${yy + 16}" font-size="12" font-weight="700" fill="#0f172a">${esc(b.teks)}</text>
      <rect data-tip="${esc(b.tip)}" data-x="${pl + w}" data-y="${yy + 4}" x="0" y="${yy}" width="${W}" height="${tinggiBaris}" fill="transparent" ${b.klik ? `data-klik="${esc(b.klik)}"` : ''}/>`;
  }).join('')}</svg><div class="tip"></div></div>`;
}
function svgBatangV(batang, { aria = 'Grafik batang', tinggi = 200, maks = null, satuan = '%', lebar: W = 640, labelBesar = false } = {}) {
  if (!batang.length) return '<div class="kosong">Belum ada data.</div>';
  const H = tinggi, pl = 40, pr = 10, pt = 14, pb = 30;
  const top = maks ?? Math.max(5, Math.ceil(Math.max(...batang.map(b => b.nilai || 0)) / 5) * 5);
  const lebar = W - pl - pr, slot = lebar / batang.length, bw = Math.min(56, slot * 0.6);
  const y = v => pt + (1 - v / (top || 1)) * (H - pt - pb);
  let grid = '';
  [0, top / 2, top].forEach(v => grid += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${WARNA_GRID}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${WARNA_TEKS}">${Math.round(v * 10) / 10}${satuan}</text>`);
  return `<div class="grafik"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${grid}${batang.map((b, i) => {
    const cx = pl + slot * i + slot / 2, v = b.nilai || 0, h = Math.max(0, y(0) - y(v));
    return `<path d="M${cx - bw / 2} ${y(0)} V${y(0) - Math.max(h - 4, 0)} q0 -4 4 -4 H${cx + bw / 2 - 4} q4 0 4 4 V${y(0)} Z" fill="${WARNA_SERI}" ${h < 4 ? 'opacity=".35"' : ''}/>
      <text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="${labelBesar ? 18 : 12}" fill="#334155" font-weight="600">${esc(b.label)}</text>
      <rect data-tip="${esc(b.tip)}" data-x="${cx}" data-y="${y(v)}" x="${cx - slot / 2}" y="${pt}" width="${slot}" height="${H - pt - pb}" fill="transparent"/>`;
  }).join('')}</svg><div class="tip"></div></div>`;
}
// Grafik digambar setelah tempatnya ada, supaya ukuran teks sesuai lebar layar
const GRAFIK = [];
function tempatGrafik(fn) { return `<div data-grafik="${GRAFIK.push(fn) - 1}"></div>`; }
function gambarGrafik(akar) {
  $$('[data-grafik]', akar).forEach(el => { const fn = GRAFIK[el.dataset.grafik]; if (fn) el.outerHTML = fn(Math.max(300, Math.round(el.clientWidth || 640))); });
  GRAFIK.length = 0;
  pasangTip(akar);
}
function pasangTip(akar) {
  $$('.grafik', akar).forEach(g => {
    const tip = g.querySelector('.tip'), svg = g.querySelector('svg'); if (!tip || !svg) return;
    const sembunyi = () => { tip.style.opacity = 0; g.querySelectorAll('.titik-aktif').forEach(c => c.classList.remove('titik-aktif')); };
    g.addEventListener('pointermove', e => {
      const h = e.target.closest('[data-tip]'); if (!h) return sembunyi();
      const vb = svg.viewBox.baseVal, r = svg.getBoundingClientRect();
      tip.innerHTML = h.dataset.tip;
      tip.style.left = (Number(h.dataset.x) * r.width / vb.width) + 'px';
      tip.style.top = (Number(h.dataset.y) * r.height / vb.height) + 'px';
      tip.style.opacity = 1;
      g.querySelectorAll('.titik-aktif').forEach(c => c.classList.remove('titik-aktif'));
      if (h.dataset.i) g.querySelector(`circle[data-i="${h.dataset.i}"]`)?.classList.add('titik-aktif');
    });
    g.addEventListener('pointerleave', sembunyi);
  });
}
const kpi = (lbl, val, sub = '', tanda = '') => `<div class="kpi"><div class="lbl">${tanda ? `<span class="tanda" style="background:${tanda}"></span>` : ''}${esc(lbl)}</div><div class="val">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
const WARNA_STATUS = { hadir: '#22c55e', terlambat: '#f97316', izin: '#3b82f6', sakit: '#8b5cf6', alpa: '#ef4444', belum: '#94a3b8' };
function htmlKpiHariIni(h, total) {
  const hadir = h.hadir + h.terlambat;
  if (!h.efektif) return `<div class="banner info"><i class="ph-bold ph-sun"></i>Hari ini bukan hari sekolah.</div>`;
  return `<div class="kpi-grid">
    ${kpi('Hadir hari ini', `${hadir}<small> / ${h.efektif}</small>`, fmtPct(pct(hadir, h.efektif)) + ' dari siswa', WARNA_STATUS.hadir)}
    ${kpi('Terlambat', h.terlambat, 'termasuk dalam hadir', WARNA_STATUS.terlambat)}
    ${kpi('Izin / Sakit', h.izin + h.sakit, `${h.izin} izin · ${h.sakit} sakit`, WARNA_STATUS.izin)}
    ${kpi('Alpa', h.alpa, 'tanpa keterangan', WARNA_STATUS.alpa)}
    ${kpi('Belum absen', h.belum, 'absen masuk masih dibuka', WARNA_STATUS.belum)}
  </div>`;
}

async function tabDasbor(main) {
  if (S.profil.peran === 'wali') {
    await pastikanKelas();
    if (!S.staf.kelas.length) { main.innerHTML = pesanTanpaKelas(); return; }
    S.staf.dkKelas = S.staf.dkKelas || String(S.staf.kelas[0].id);
    return dasborKelas(main, false);
  }
  if (S.staf.dkBuka) return dasborKelas(main, true);
  return dasborMadrasah(main);
}

function rentangPreset(kode) {
  const hariIni = tglISO(sekarang()), [y, m] = hariIni.split('-').map(Number);
  const mundur = n => { const d = new Date(hariIni + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); };
  if (kode === '7') return [mundur(6), hariIni];
  if (kode === '30') return [mundur(29), hariIni];
  if (kode === 'bulan') return [`${y}-${String(m).padStart(2, '0')}-01`, hariIni];
  // semester: Juli–Desember (ganjil) atau Januari–Juni (genap)
  return m >= 7 ? [`${y}-07-01`, hariIni] : [`${y}-01-01`, hariIni];
}

  const st = S.staf;
  st.dmPreset = st.dmPreset || '30';

  main.innerHTML = `<div class="panel">
    <div class="panel-kepala"><div><h2>Dasbor Madrasah</h2><p class="muted kecil">Gambaran kehadiran seluruh kelas. Pilih periode untuk melihat tren.</p>

      <div class="bidang"><label class="label">Dari</label><input type="date" class="input input-kecil" id="dm-dari" value="${st.dmRentang[0]}"></div>

  const ubah = () => { st.dmPreset = ''; st.dmRentang = [$('#dm-dari').value, $('#dm-sampai').value]; dasborMadrasah(main); };

/* ---------- Unduh / cetak rekap bulanan (matriks tanggal × siswa) ---------- */
function kodeHari(h, siswa) {
  if (!h.efektif) return h.libur ? 'L' : '-';
  return siswa.kode[h.tanggal] || '';
}
async function unduhMatriks(kelasId, y, m) {
  try {
    toast('Menyiapkan file Excel…');
    const [d] = await Promise.all([rpc('hk_rekap_matriks', { p_kelas_id: kelasId, p_tahun: y, p_bulan: m }), muatSkrip(XLSX_URL)]);
    const hari = d.hari, nh = hari.length;
    const aoa = [
      [`REKAP KEHADIRAN SISWA — ${d.madrasah}`],
      [`Kelas: ${d.kelas}    Bulan: ${BULAN[d.bulan - 1]} ${d.tahun}    Wali Kelas: ${d.wali || '-'}`],
      [],
      ['No', 'NISN', 'Nama', ...hari.map(h => Number(h.tanggal.slice(8))), 'H', 'T', 'I', 'S', 'A', 'Hari Efektif', '% Hadir'],
      ['', '', '', ...hari.map(h => HARI_PENDEK[new Date(h.tanggal + 'T00:00:00Z').getUTCDay() === 0 ? 6 : new Date(h.tanggal + 'T00:00:00Z').getUTCDay() - 1]), '', '', '', '', '', '', ''],
      ...d.siswa.map((x, i) => [i + 1, x.nisn, x.nama, ...hari.map(h => kodeHari(h, x)), x.hadir, x.terlambat, x.izin, x.sakit, x.alpa, x.hari,
        x.hari ? Math.round(((x.hadir + x.terlambat) / x.hari) * 1000) / 10 : '']),
      [],
      ['Keterangan: H = Hadir, T = Terlambat (tetap dihitung hadir), I = Izin, S = Sakit, A = Alpa/tanpa keterangan, L = Libur, - = bukan hari sekolah. Kolom kosong = hari yang belum berjalan.'],
      ...hari.filter(h => h.libur).map(h => [`L ${fmtTglSedang(h.tanggal)}: ${h.libur}`]),
      [],
      ['', '', `......................, ${fmtTglSedang(tglISO(sekarang()))}`],
      ['', '', 'Wali Kelas,'], [], [], ['', '', d.wali || '(.................................)'],
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 4 }, { wch: 13 }, { wch: 30 }, ...hari.map(() => ({ wch: 3.6 })), { wch: 4 }, { wch: 4 }, { wch: 4 }, { wch: 4 }, { wch: 4 }, { wch: 11 }, { wch: 8 }];
    const kolomAkhir = 3 + nh + 6;
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: kolomAkhir } }, { s: { r: 1, c: 0 }, e: { r: 1, c: kolomAkhir } }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `Rekap ${BULAN[d.bulan - 1]}`.slice(0, 31));
    XLSX.writeFile(wb, namaFile(`Rekap_Kehadiran_${d.kelas}_${BULAN[d.bulan - 1]}_${d.tahun}.xlsx`));
  } catch (e) { if (e.message !== 'SESI') toast(e.message, true); }
}
function cetakHTML(judul, isi, { landscape = false, css = '' } = {}) {
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  const doc = f.contentDocument;
  doc.open();
  doc.write(`<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>${esc(judul)}</title><style>
    @page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:10mm}
    *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{font-family:Arial,Helvetica,sans-serif;font-size:9pt;color:#000;margin:0}
    h1{font-size:13pt;margin:0 0 2px;text-align:center} .sub{text-align:center;margin-bottom:8px;font-size:10pt}
    table{border-collapse:collapse;width:100%} th,td{border:1px solid #444;padding:2px 3px;text-align:center}
    td.kiri,th.kiri{text-align:left} .libur{background:#e5e7eb} .A{background:#fee2e2;font-weight:bold} .T{background:#ffedd5} .I{background:#dbeafe} .S{background:#ede9fe}
    .ket{margin-top:6px;font-size:8pt} .ttd{margin-top:14px;display:flex;justify-content:flex-end} .ttd div{text-align:center;width:220px}
    ${css}</style></head><body>${isi}</body></html>`);
  doc.close();
  setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast('Pencetakan tidak didukung di perangkat ini.', true); } setTimeout(() => f.remove(), 60000); }, 500);
}
async function cetakMatriks(kelasId, y, m) {
  try {
    const d = await rpc('hk_rekap_matriks', { p_kelas_id: kelasId, p_tahun: y, p_bulan: m });
    const hari = d.hari;
    const isi = `<h1>REKAP KEHADIRAN SISWA</h1>
      <div class="sub">${esc(d.madrasah)} · Kelas ${esc(d.kelas)} · ${BULAN[d.bulan - 1]} ${d.tahun} · Wali Kelas: ${esc(d.wali || '-')}</div>
      <table><thead><tr><th rowspan="2">No</th><th rowspan="2" class="kiri">Nama</th>${hari.map(h => `<th class="${h.efektif ? '' : 'libur'}">${Number(h.tanggal.slice(8))}</th>`).join('')}
        <th rowspan="2">H</th><th rowspan="2">T</th><th rowspan="2">I</th><th rowspan="2">S</th><th rowspan="2">A</th><th rowspan="2">%</th></tr>
        <tr>${hari.map(h => { const w = new Date(h.tanggal + 'T00:00:00Z').getUTCDay(); return `<th class="${h.efektif ? '' : 'libur'}" style="font-weight:normal;font-size:7pt">${HARI_PENDEK[w === 0 ? 6 : w - 1].slice(0, 2)}</th>`; }).join('')}</tr></thead>
      <tbody>${d.siswa.map((x, i) => `<tr><td>${i + 1}</td><td class="kiri">${esc(x.nama)}</td>${hari.map(h => { const k = kodeHari(h, x); return `<td class="${h.efektif ? k : 'libur'}">${k === '-' ? '' : k}</td>`; }).join('')}
        <td>${x.hadir}</td><td>${x.terlambat}</td><td>${x.izin}</td><td>${x.sakit}</td><td>${x.alpa}</td><td>${x.hari ? Math.round(((x.hadir + x.terlambat) / x.hari) * 100) : ''}</td></tr>`).join('')}</tbody></table>
      <div class="ket">H = Hadir · T = Terlambat (dihitung hadir) · I = Izin · S = Sakit · A = Alpa · kolom abu-abu = libur/bukan hari sekolah${hari.filter(h => h.libur).map(h => ` · ${Number(h.tanggal.slice(8))}: ${esc(h.libur)}`).join('')}</div>
      <div class="ttd"><div>......................, ${esc(fmtTglSedang(tglISO(sekarang())))}<br>Wali Kelas,<br><br><br><br><b>${esc(d.wali || '(.................................)')}</b></div></div>`;
    cetakHTML(`Rekap ${d.kelas} ${BULAN[d.bulan - 1]} ${d.tahun}`, isi, { landscape: true, css: hari.length > 30 ? 'body{font-size:8pt}' : '' });
  } catch (e) { if (e.message !== 'SESI') toast(e.message, true); }
}

/* ---------- Tab Rekap Rapor ---------- */
function presetSemester() {
  const [y, m] = tglISO(sekarang()).split('-').map(Number);
  const ta = m >= 7 ? y : y - 1;   // tahun ajaran dimulai Juli
  return [
    { k: 'ganjil', label: `Semester Ganjil ${ta}/${ta + 1}`, dari: `${ta}-07-01`, sampai: `${ta}-12-31` },
    { k: 'genap', label: `Semester Genap ${ta}/${ta + 1}`, dari: `${ta + 1}-01-01`, sampai: `${ta + 1}-06-30` },
    { k: 'genap-lalu', label: `Semester Genap ${ta - 1}/${ta}`, dari: `${ta}-01-01`, sampai: `${ta}-06-30` },
  ];
}

let posPemindai = null, posTerakhir = { kode: '', t: 0 }, posSibuk = false;
async function hentikanPos() {
  const p = posPemindai; posPemindai = null;
  if (!p) return;
  try { if (p.isScanning) await p.stop(); } catch (e) {}
  try { p.clear(); } catch (e) {}
}
function bunyi(ok) {
  try {
    const ctx = bunyi.ctx || (bunyi.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = ok ? 880 : 220; o.type = 'sine'; g.gain.value = 0.15;
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + (ok ? 0.12 : 0.35));
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]);
}

        teks => prosesPos({ kode: teks }), () => {});

async function cariPos(q) {
  const el = $('#pos-cari-hasil'); if (!el) return;
  if (q.trim().length < 2) { el.innerHTML = ''; return; }
  try {
    const d = await rpc('hk_pos_cari', { p_q: q });
    el.innerHTML = d.length ? d.map(x => `<div class="baris-siswa"><div><b>${esc(x.nama)}</b><div class="muted kecil">${esc(x.kelas || '—')} · ${esc(x.nisn)}${x.jam_masuk ? ` · masuk ${esc(x.jam_masuk)}` : ''}${x.jam_pulang ? ` · pulang ${esc(x.jam_pulang)}` : ''}${!x.jam_masuk && x.status ? ' · ' + esc(STATUS[x.status]?.label || x.status) : ''}</div></div>

      : '<p class="muted kecil">Tidak ditemukan.</p>';
    $$('[data-pm]', el).forEach(b => b.onclick = () => prosesPos({ siswa: Number(b.dataset.pm), nama: b.dataset.nm, jenis: b.dataset.j }));
  } catch (e) { if (e.message !== 'SESI') el.innerHTML = `<p class="muted kecil">${esc(e.message)}</p>`; }

async function prosesPos({ kode = null, siswa = null, nama = '', jenis = null }) {
  const now = Date.now();
  if (kode && kode === posTerakhir.kode && now - posTerakhir.t < 5000) return;   // abaikan scan ganda
  if (posSibuk) return;
  posSibuk = true; posTerakhir = { kode, t: now };
  const j = jenis || S.staf.posJenis || 'otomatis';
  const kotak = $('#pos-hasil');
  const tampil = (kelas, ikon, judul, status) => { if (kotak) { kotak.className = 'pos-hasil ' + kelas; kotak.innerHTML = `<i class="ph-fill ${ikon}" style="font-size:40px"></i><div class="nm">${esc(judul)}</div><div class="st">${esc(status)}</div>`; } };
  try {
    if (kode && !/^HKKARTU\|/i.test(kode)) throw new Error(/^HADIRKUY\|/.test(kode) ? 'Ini QR layar absen, bukan kartu siswa.' : 'QR ini bukan Kartu Siswa HadirKuy.');
    const r = await rpc('hk_pos_absen', { p_kode: kode, p_siswa: siswa, p_jenis: j });
    const telat = r.jenis === 'masuk' && r.status === 'terlambat';
    tampil(telat ? 'telat' : 'ok', 'ph-check-circle', r.siswa.nama,
      `${r.siswa.kelas} · ${r.jenis === 'masuk' ? 'Masuk' : 'Pulang'} ${r.jam} ${r.label_zona}${telat ? ` · terlambat ${r.menit_terlambat} menit` : ''}`);
    tampilFotoPos(r.siswa.id);
    bunyi(true);
    S.staf.posRiwayat.unshift({ nama: r.siswa.nama, kelas: r.siswa.kelas, teks: `${r.jenis === 'masuk' ? 'Masuk' : 'Pulang'} ${r.jam}${telat ? ' · terlambat' : ''}` });
  } catch (e) {
    if (e.message === 'SESI') { posSibuk = false; return; }
    if (e.jaringan) {
      antrePos.tambah({ kode, siswa, jenis: j, waktu: sekarang().toISOString(), label: nama || 'kartu' });
      tampil('antre', 'ph-cloud-arrow-up', nama || 'Kartu terbaca', `Tersimpan offline (${fmtJam(sekarang())}) · dikirim otomatis saat online`);
      bunyi(true);
      S.staf.posRiwayat.unshift({ nama: nama || 'Kartu (offline)', kelas: '', teks: `Antre ${fmtJam(sekarang())}` });
    } else { tampil('gagal', 'ph-warning-circle', nama || 'Belum tercatat', e.message); bunyi(false); }
  }
  S.staf.posRiwayat = S.staf.posRiwayat.slice(0, 30);
  renderRiwayatPos();
  setTimeout(() => { posSibuk = false; }, 1200);
}
// Tampilkan foto siswa agar petugas bisa mencocokkan wajah (mencegah kartu dipinjamkan)
async function tampilFotoPos(id) {
  await muatFoto([id]);

function renderRiwayatPos() {
  const el = $('#pos-riwayat'); if (!el) return;
  el.innerHTML = (S.staf.posRiwayat || []).map(x => `<div><span><b>${esc(x.nama)}</b> <span class="muted">${esc(x.kelas)}</span></span><span>${esc(x.teks)}</span></div>`).join('') || '<p class="muted kecil">Belum ada.</p>';

function svgQR(teks) {

/* ---------- Impor siswa: kolom terpisah NO | NISN | NAMA | KELAS | NO WA ORTU ---------- */
const KOLOM_IMPOR = ['NO', 'NISN', 'NAMA', 'KELAS', 'NO WA ORTU'];
const normKolom = h => String(h ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
function petaKolom(baris) {
  const p = {};
  baris.forEach((h, i) => {
    const k = normKolom(h);
    if (!k) return;
    if (p.nisn === undefined && k.includes('nisn')) p.nisn = i;
    else if (p.nama === undefined && (k === 'nama' || k.startsWith('namasiswa') || k.startsWith('namalengkap') || k === 'namapesertadidik')) p.nama = i;
    else if (p.kelas === undefined && (k === 'kelas' || k === 'rombel' || k.startsWith('kelasrombel'))) p.kelas = i;
    else if (p.wa === undefined && (k.includes('wa') || k.includes('hp') || k.includes('telp') || k.includes('ortu') || k.includes('orangtua'))) p.wa = i;
    else if (p.no === undefined && (k === 'no' || k === 'nomor' || k === 'nourut')) p.no = i;
  });
  return p.nisn !== undefined && p.nama !== undefined ? p : null;
}
function rapikanNisn(v) {
  let t = String(v ?? '').trim().replace(/\.0+$/, '').replace(/\s+/g, '');
  if (/^\d+$/.test(t) && t.length < 10) t = t.padStart(10, '0');   // nol di depan hilang karena Excel
  return t;
}
function rapikanWA(v) {
  let d = String(v ?? '').replace(/\.0+$/, '').replace(/[^0-9]/g, '');
  if (d.startsWith('8')) d = '0' + d;                                // nol di depan hilang karena Excel
  return d;
}
const waValid = d => !d || /^(0|62)8\d{7,12}$/.test(d);
// Ubah tabel (array 2 dimensi) menjadi data siswa + status pemeriksaan per baris
function tabelKeSiswa(tabel) {
  const bersih = tabel.map(r => (r || []).map(c => String(c ?? '').trim())).filter(r => r.some(c => c));
  if (!bersih.length) return [];
  let peta = null, mulai = 0;
  for (let i = 0; i < Math.min(10, bersih.length); i++) { peta = petaKolom(bersih[i]); if (peta) { mulai = i + 1; break; } }
  if (!peta) {
    // tanpa baris judul: anggap urutan NO, NISN, NAMA, KELAS, NO WA ORTU (atau tanpa NO)
    const adaNo = /^\d{1,4}$/.test(bersih[0][0] || '') && (bersih[0].length >= 5 || /^\d{6,}$/.test(bersih[0][1] || ''));
    peta = adaNo ? { no: 0, nisn: 1, nama: 2, kelas: 3, wa: 4 } : { nisn: 0, nama: 1, kelas: 2, wa: 3 };
  }
  const lihat = new Map();
  return bersih.slice(mulai).map((r, i) => {
    const x = {
      no: peta.no !== undefined ? r[peta.no] : String(i + 1),
      nisn: rapikanNisn(r[peta.nisn]), nama: (r[peta.nama] || '').replace(/\s+/g, ' '),
      kelas: (peta.kelas !== undefined ? r[peta.kelas] : '') || '', no_wa: peta.wa !== undefined ? rapikanWA(r[peta.wa]) : '',
    };
    const g = [];
    if (!x.nisn) g.push('NISN kosong');
    else if (!/^[A-Za-z0-9._-]{3,40}$/.test(x.nisn)) g.push('NISN tidak valid');
    if (!x.nama) g.push('Nama kosong');
    if (!waValid(x.no_wa)) g.push('No WA tidak valid');
    if (x.nisn) { const k = x.nisn.toLowerCase(); if (lihat.has(k)) g.push(`NISN ganda (baris ${lihat.get(k)})`); else lihat.set(k, i + 1); }
    x.galat = g; return x;
  }).filter(x => x.nisn || x.nama);
}
function teksKeTabel(teks) {
  const baris = String(teks).replace(/^﻿/, '').replace(/\r/g, '').split('\n').filter(b => b.trim());
  if (!baris.length) return [];
  const contoh = baris[0];
  const pemisah = contoh.includes('\t') ? '\t' : (contoh.split(';').length > contoh.split(',').length ? ';' : ',');
  return baris.map(b => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < b.length; i++) {
      const ch = b[i];
      if (q) { if (ch === '"') { if (b[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === pemisah) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur); return out;
  });
}
async function bacaFileImpor(file) {
  if (/\.(xlsx|xls|ods)$/i.test(file.name)) {
    await muatSkrip(XLSX_URL);
    const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
  }
  return teksKeTabel(await file.text());
}

    ws['!cols'] = [{ wch: 5 }, { wch: 14 }, { wch: 32 }, { wch: 10 }, { wch: 16 }];
    ['B2', 'B3', 'E2', 'E3'].forEach(c => { if (ws[c]) { ws[c].t = 's'; ws[c].z = '@'; } });
    const petunjuk = XLSX.utils.aoa_to_sheet([
      ['PETUNJUK IMPOR SISWA — HadirKuy'], [],
      ['Kolom', 'Isi'], ['NO', 'Nomor urut (boleh dikosongkan, tidak disimpan).'],
      ['NISN', 'Wajib. 10 digit. Format sel sebagai Teks agar angka 0 di depan tidak hilang (jika hilang, aplikasi menambahkannya kembali).'],
      ['NAMA', 'Wajib. Nama lengkap siswa.'], ['KELAS', 'Contoh: X-1, XI IPA 2. Kelas yang belum ada dibuat otomatis.'],
      ['NO WA ORTU', 'Opsional. Contoh 081234567890. Dipakai untuk notifikasi WhatsApp ke orang tua.'], [],
      ['NISN yang sudah terdaftar akan diperbarui nama, kelas, dan No WA-nya. Kata sandi awal siswa = NISN.']]);
    petunjuk['!cols'] = [{ wch: 14 }, { wch: 90 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data Siswa');
    XLSX.utils.book_append_sheet(wb, petunjuk, 'Petunjuk');
    XLSX.writeFile(wb, 'Templat_Impor_Siswa_HadirKuy.xlsx');
  } catch (e) { toast(e.message, true); }
}
function modalImpor() {
  const m = bukaModal('Impor Siswa', `
    <div class="banner info"><i class="ph-bold ph-info"></i><span>Siapkan file Excel dengan kolom terpisah:
      ${KOLOM_IMPOR.map(k => `<span class="chip st-hadir" style="margin:2px">${k}</span>`).join('')}
      <br>Urutan kolom bebas asalkan judul kolom ada. Kelas yang belum ada dibuat otomatis; NISN yang sudah ada diperbarui.</span></div>

      <label class="btn btn-garis btn-kecil" style="cursor:pointer"><i class="ph-bold ph-upload-simple"></i>Pilih file (.xlsx / .csv)
        <input type="file" accept=".xlsx,.xls,.ods,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" id="im-file" hidden></label>
      <span class="muted kecil" id="im-nama-file"></span>
    </div>

      <textarea class="input" id="im-teks" rows="5" style="margin-top:8px" placeholder="Blok tabel di Excel (termasuk judul kolom), salin (Ctrl+C), lalu tempel (Ctrl+V) di sini"></textarea></details>
    <div id="im-tabel"></div>
    <div id="im-hasil"></div>
    <div class="modal-aksi"><button class="btn btn-garis" data-tutup>Tutup</button><button class="btn btn-gelap" id="im-kirim" disabled>Impor</button></div>`, true);
  let data = [];
  const tampil = () => {
    const ok = data.filter(x => !x.galat.length), salah = data.length - ok.length;
    $('#im-tabel', m).innerHTML = data.length ? `
      <div class="ringkas"><span class="chip st-hadir">${ok.length} siap diimpor</span>${salah ? `<span class="chip st-alpa">${salah} bermasalah (dilewati)</span>` : ''}</div>
      <div class="tabel-wrap" style="max-height:340px;overflow:auto"><table>
        <thead><tr>${KOLOM_IMPOR.map(k => `<th>${k}</th>`).join('')}<th>Periksa</th></tr></thead>
        <tbody>${data.map(x => `<tr${x.galat.length ? ' style="background:#fff1f2"' : ''}>
          <td class="muted">${esc(x.no)}</td><td class="tebal">${esc(x.nisn)}</td><td>${esc(x.nama)}</td><td>${esc(x.kelas || '—')}</td><td>${esc(x.no_wa || '—')}</td>
          <td>${x.galat.length ? `<span class="chip st-alpa">${esc(x.galat.join(', '))}</span>` : '<span class="chip st-hadir">OK</span>'}</td></tr>`).join('')}</tbody></table></div>`
      : '';
    $('#im-kirim', m).disabled = !ok.length;
    $('#im-kirim', m).textContent = ok.length ? `Impor ${ok.length} siswa` : 'Impor';
  };
  const muat = tabel => {
    data = tabelKeSiswa(tabel); $('#im-hasil', m).innerHTML = '';
    if (!data.length) $('#im-tabel', m).innerHTML = '<div class="galat">Tidak ada data siswa yang terbaca. Pastikan ada kolom NISN dan NAMA.</div>';
    else tampil();
  };
  $('#im-templat', m).onclick = unduhTemplatImpor;
  $('#im-teks', m).oninput = e => muat(teksKeTabel(e.target.value));
  $('#im-file', m).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    $('#im-nama-file', m).textContent = f.name;
    try { muat(await bacaFileImpor(f)); } catch (err) { $('#im-tabel', m).innerHTML = `<div class="galat">File tidak dapat dibaca: ${esc(err.message)}</div>`; }
    e.target.value = '';
  };
  $('#im-kirim', m).onclick = async () => {
    const kirim = data.filter(x => !x.galat.length).map(x => ({ nisn: x.nisn, nama: x.nama, kelas: x.kelas, no_wa: x.no_wa }));
    const btn = $('#im-kirim', m); btn.disabled = true; btn.innerHTML = '<i class="ph-bold ph-spinner putar"></i> Mengimpor…';
    try {
      const r = await rpc('hk_admin_impor_siswa', { p_data: kirim });
      $('#im-hasil', m).innerHTML = `<div class="banner info"><i class="ph-bold ph-check-circle"></i><span>${r.baru} siswa baru, ${r.diperbarui} diperbarui, ${r.kelas_baru} kelas baru, ${r.dilewati} dilewati.${(r.catatan || []).length ? '<br>' + r.catatan.map(esc).join('<br>') : ''}</span></div>`;
      S.staf.kelas = null; await pastikanKelas(true); muatPengguna();
      btn.innerHTML = 'Selesai';
    } catch (e) { if (e.message !== 'SESI') $('#im-hasil', m).innerHTML = `<div class="galat">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = 'Impor'; }
  };
}

/* ---------- Tab: Kelas (admin) ---------- */
async function tabKelas(main) {
  const kelas = await pastikanKelas(true);
  main.innerHTML = `<div class="panel">
    <div class="panel-kepala"><div><h2>Kelas & Wali Kelas</h2><p class="muted kecil">Wali kelas hanya dapat melihat dan mencatat kehadiran kelas perwaliannya.</p></div>

    ${kelas.length ? `<div class="tabel-wrap"><table><thead><tr><th>Kelas</th><th>Wali Kelas</th><th class="angka">Siswa Aktif</th><th></th></tr></thead>
      <tbody>${kelas.map(k => `<tr><td class="tebal">${esc(k.nama)}</td><td>${k.wali_nama ? esc(k.wali_nama) : '<span class="muted">Belum ditetapkan</span>'}</td><td class="angka">${k.jumlah_siswa}</td>
        <td style="white-space:nowrap;text-align:right"><button class="btn btn-garis btn-kecil" data-ubah="${k.id}">Ubah</button> <button class="btn btn-bahaya btn-kecil" data-hapus="${k.id}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`
      : '<div class="kosong"><i class="ph ph-chalkboard"></i>Belum ada kelas. Tambahkan manual atau lewat Impor Siswa di menu Pengguna.</div>'}
  </div>`;
  $('#k-tambah').onclick = () => modalKelas(null);
  $$('[data-ubah]', main).forEach(b => b.onclick = () => modalKelas(kelas.find(k => String(k.id) === b.dataset.ubah)));
  $$('[data-hapus]', main).forEach(b => b.onclick = async () => {
    const k = kelas.find(x => String(x.id) === b.dataset.hapus);
    if (!(await konfirmasi(`Hapus kelas ${k.nama}?\n${k.jumlah_siswa} siswa di kelas ini akan menjadi "tanpa kelas" (data absensi tetap tersimpan).`, { ok: 'Hapus', bahaya: true }))) return;
    try { await rpc('hk_admin_kelas_hapus', { p_id: k.id }); toast('Kelas dihapus.'); tampilTabStaf(); } catch (e) { if (e.message !== 'SESI') toast(e.message, true); }
  });
}

    try { await rpc('hk_admin_pengaturan_simpan', { p_data: data }); await muatBeranda(); toast('Pengaturan tersimpan.'); }
    catch (err) { if (err.message !== 'SESI') { $('#a-galat').textContent = err.message; window.scrollTo({ top: 0, behavior: 'smooth' }); } }
    btn.disabled = false;
  };
  $('#f-token').onsubmit = async e => {
    e.preventDefault(); const t = e.target.token.value.trim();
    if (!t) return toast('Tempel token Fonnte terlebih dahulu.', true);
    try { await rpc('hk_admin_wa_token', { p_wa_token: t }); toast('Token tersimpan.'); tampilTabStaf(); } catch (err) { if (err.message !== 'SESI') toast(err.message, true); }
  };
  const ht = $('#a-hapus-token');
  if (ht) ht.onclick = async () => {
    if (!(await konfirmasi('Hapus token Fonnte? Pesan akan kembali ke antrean manual.', { ok: 'Hapus', bahaya: true }))) return;
    try { await rpc('hk_admin_wa_token', { p_wa_token: null }); toast('Token dihapus.'); tampilTabStaf(); } catch (err) { if (err.message !== 'SESI') toast(err.message, true); }
  };
  $('#f-uji').onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await rpc('hk_admin_wa_uji', { p_nomor: e.target.nomor.value });
      toast(r.gateway ? `Pesan uji dikirim ke +${r.tujuan}. Cek WhatsApp dan menu Notifikasi WA.` : `Pesan uji masuk antrean (gateway belum aktif). Lihat menu Notifikasi WA.`);
    } catch (err) { if (err.message !== 'SESI') toast(err.message, true); }
  };
  $('#a-proses').onclick = async () => {
    try { const r = await rpc('hk_admin_proses'); toast(`Selesai: ${r.alpa_diantrekan} kabar "belum hadir" diantrekan, ${r.dikirim} pesan dikirim.`); }
    catch (err) { if (err.message !== 'SESI') toast(err.message, true); }
  };
  $('#f-libur').onsubmit = async e => {
    e.preventDefault(); const fl = e.target;
    try { await rpc('hk_admin_libur_simpan', { p_tanggal: fl.tgl.value, p_keterangan: fl.ket.value }); toast('Hari libur ditambahkan.'); tampilTabStaf(); }
    catch (err) { if (err.message !== 'SESI') toast(err.message, true); }
  };
  $$('[data-hapus-libur]').forEach(b => b.onclick = async () => {
    if (!(await konfirmasi('Hapus hari libur ini?', { ok: 'Hapus', bahaya: true }))) return;
    try { await rpc('hk_admin_libur_hapus', { p_tanggal: b.dataset.hapusLibur }); toast('Hari libur dihapus.'); tampilTabStaf(); }
    catch (err) { if (err.message !== 'SESI') toast(err.message, true); }
  });
}

/* ---------- Tab: Akun ---------- */
async function tabAkun(main) {
  const p = S.profil;
  main.innerHTML = `<div class="panel" style="max-width:520px">
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">${htmlAvatar(p.id, p.nama, 'besar')}
      <div><h2>${esc(p.nama)}</h2><p class="muted">${esc(PERAN[p.peran])} · ${esc(p.username)}</p>
        <button class="btn btn-garis btn-kecil" id="ak-foto" style="margin-top:8px"><i class="ph-bold ph-camera"></i>${p.foto_versi ? 'Ganti foto' : 'Unggah foto'}</button></div></div>
    ${p.peran === 'wali' ? `<div class="daftar-info"><div><span>Kelas perwalian</span><b>${p.kelas_wali.length ? p.kelas_wali.map(k => esc(k.nama)).join(', ') : '—'}</b></div></div>` : ''}
    ${htmlTombolPasang()}
    <div class="baris"><button class="btn btn-garis" id="ak-sandi"><i class="ph-bold ph-lock-key"></i>Ganti Kata Sandi</button>
      <button class="btn btn-bahaya" id="ak-keluar"><i class="ph-bold ph-sign-out"></i>Keluar</button></div>
  </div>`;
  pasangTombolPasang(main);
  $('#ak-foto').onclick = () => modalFoto({ id: p.id, nama: p.nama }, { selesai: () => tabAkun(main) });
  $('#ak-sandi').onclick = modalGantiSandi;
  $('#ak-keluar').onclick = async () => { if (await konfirmasi('Keluar dari HadirKuy?', { ok: 'Keluar', bahaya: true })) keluar(); };
}

mulai();
</script>
